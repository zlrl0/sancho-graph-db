ctor Experiment", "text": "Single-factor experiments of extraction solvents, liquid–solid ratio, extraction time, and extraction temperature were carried out to simplify variables and factors. The conditions of extraction employed were as follows: different extraction solvents including ethanol, purified water, 60% ethanol, methanol, 0.1% ( v / v ) hydrochloric acid in ethanol, 0.1% ( v / v ) hydrochloric acid, 0.1% ( v / v ) hydrochloric acid in 60% ethanol, and 0.1% ( v / v ) hydrochloric acid in methanol were considered; liquid–solid ratios 15, 20, 25, 30, and 35 mL/g; extraction times 10, 20, 30, 40, and 50 min; and ultrasonic temperature 15, 20, 25, 30, and 35 °C.", "score": 11}], "note": "색소 추출 최적화를 위한 물·에탄올·메탄올 조건 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 884.7813131128296, "y": 146.1525275736121, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:beb87fb47fa1fe02", "kind": "paper", "name": "Daikenchuto (Da-Jian-Zhong-Tang) ameliorates intestinal fibrosis by activating myofibroblast transient receptor potential ankyrin 1 channel.", "title": "Daikenchuto (Da-Jian-Zhong-Tang) ameliorates intestinal fibrosis by activating myofibroblast transient receptor potential ankyrin 1 channel.", "doi": "10.3748/wjg.v24.i35.4036", "folder": "PMC6148431", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P7", "section": "MATERIALS AND METHODS / Materials", "text": "DKT is an aqueous extract containing processed ginger, ginseng (ginseng radix), and Japanese pepper at a ratio of 5:3:2. The dried powdered extract forms of DKT (TU-100: without maltose syrup), ginger, ginseng, and Japanese pepper were obtained from Tsumura Co. (Tokyo, Japan). These extracted powders were dissolved in ethanol by sonication and purified by filtering. Ginsenoside (Wako, Japan), 6-shogaol (Wako, Japan), hydroxy-α-sanshool (Adipogen Life Science), AITC, and HC-030031 (Sigma-Aldrich, St Louis, MO, United States) were also used in this study. Recombinant human TGF-β1 (Wako) and Type I collagen (IFP, Higashine, Japan) were added to cultured cells, as indicated by the manufacturer’s instructions. Human stealth siRNAs for TRPA1: TRPA1HSS113276 (5′-GGAGCAAUUGCUGUUUACUUCUAUU-3′ and 5′-AAUAGAAGUAAACAGCAAUUGCUCC-3′) were obtained from Invitrogen (Carlsbad, CA, United States) and used for gene silencing, according to the manufacturer’s instructions. Other TRPA1-siRNAs, TRPA1HSS113277 and TRPA1HSS189723, were also evaluated, but the silencing efficacy was inferior to that of TRPA1HSS113276 for InMyoFibs. Antibodies against TRPA1 (mouse; Sigma-Aldrich), α-SMA (Abcam, Cambridge, MA, United States), β-actin (Abcam, Cambridge, MA, United States), Collagen I (Abcam, Cambridge, MA, United States), Smad-2/3, phospho-Smad-2, and p38-MAPK (Cell Signaling Technology, Beverly, MA, United States) were used for immunoblotting and immunostaining experiments. An ELISA Kit was used to measure the Type I collagen levels in the conditioned medium.", "score": 11}], "note": "DKT aqueous extract 명시; 에탄올은 분말 재용해", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1005.8751521574794, "y": 344.0501237689719, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:7f27807c6424abdd", "kind": "paper", "name": "A Method for LC-MS/MS Profiling of Coumarins in Zanthoxylum zanthoxyloides (Lam.) B. Zepernich and Timler Extracts and Essential Oils.", "title": "A Method for LC-MS/MS Profiling of Coumarins in Zanthoxylum zanthoxyloides (Lam.) B. Zepernich and Timler Extracts and Essential Oils.", "doi": "10.3390/molecules22010174", "folder": "PMC6155696", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum zanthoxyloides" kg -1 D-galactose subcutaneously) with 10 mice in each group, orally administered once daily.", "matches": {"물·열수 추출물": "water extract", "기타 유기용매 추출물": "petroleum ether extract", "정유·휘발성 오일": "volatile oil"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 823.9543032228115, "y": 157.46544619458288, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:c5978cbb8bae57e3", "kind": "paper", "name": "Effect of red pepper ( Zanthoxylum bungeanum Maxim.) leaf extract on volatile flavor compounds of salted silver carp.", "title": "Effect of red pepper ( Zanthoxylum bungeanum Maxim.) leaf extract on volatile flavor compounds of salted silver carp.", "doi": "10.1002/fsn3.1380", "folder": "PMC7063358", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P4", "section": "MATERIALS AND METHODS / Preparation of fish samples", "text": "Silver carp with the average weight of 1.5 ± 0.5 kg was obtained from a local farmers' market in Nanjing in September 2015. The fish was split by the method of Li, Hui, et al. ( 2015 ). The three fish were randomly sampled as control of the raw material; the remaining fish were salted with 4% salt. Total phenolic content of ZML extract was 555 mg/g, and so the addition of ZML extract added to salted fish was selected 0.03% (w/w). Then, ZML extract was added (w/w) by the method of Li, Hui, et al. ( 2015 ) following formulation: (a) control (no antioxidant added); (b) 0.030% ZML ethanol extract. For these two groups, the samples were salted with 4% salt for 2 days at 4℃ and 85%–90% relative humidity (RH) in plastic containers. During the process of drying, the temperature was increased to 17℃ and the RH was set to 85% on the 3rd day and 4th day, then the temperature was increased to 19℃ and the RH was set to 82% on the 5th day and 6th day, at last the temperature was increased to 21℃ and the RH was set to 79% on the 7th day and 8th day. The dorsal and ventral muscle were trimmed from the fish at the 4 process points (end of salting, drying‐processing 2, 4, and 6 days) and then was used to analyze. Samples were cut into small pieces, then vacuum‐packaged and stored at −20℃ until analysis. All of the analyses were performed in triplicate.", "score": 11}], "note": "ethanol leaf extract를 생선에 실제 첨가", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1041.7812918682953, "y": 300.69277160945694, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:6e541f3b23d9bc8a", "kind": "paper", "name": "Total Phenolic, Flavonoid Contents, and Antioxidant Activities of Fruit, Seed, and Bark Extracts of Zanthoxylum armatum DC.", "title": "Total Phenolic, Flavonoid Contents, and Antioxidant Activities of Fruit, Seed, and Bark Extracts of Zanthoxylum armatum DC.", "doi": "10.1155/2020/8780704", "folder": "PMC7102453", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum armatum"], "category": "메탄올·함수메탄올 추출물", "types": ["메탄올·함수메탄올 추출물"], "evidence": [{"location": "abstract", "section": "", "text": "This study aims to quantify the total phenolic and flavonoid contents (TPC and TFC) and antioxidant properties of methanol extracts of fruits, seeds, and bark of an important medicinal and aromatic plant, Zanthoxylum armatum collected from wild and cultivated populations in Nepal.", "matches": {"메탄올·함수메탄올 추출물": "methanol extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 766.8556773137526, "y": 320.18450118397374, "anchor": 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 953.2203279887991, "y": 382.9766721323785, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:f880f71477a49eea", "kind": "paper", "name": "Antiplasmodial and Cytotoxic Activities of Extracts of Selected Medicinal Plants Used to Treat Malaria in Embu County, Kenya.", "title": "Antiplasmodial and Cytotoxic Activities of Extracts of Selected Medicinal Plants Used to Treat Malaria in Embu County, Kenya.", "doi": "10.1155/2020/8871375", "folder": "PMC7364238", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["Terminalia", "Erythrina", "Senna", "Leonotis", "Sterculia", "Carissa", "Tithonia", "Schkuhria", "Zanthoxylum chalybeum"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "abstract", "section": "", "text": "Based on the fact that studies involving antimalarial medicinal plants as potential sources of efficacious and cost-effective pharmacotherapies are far between, this research was designed to investigate antiplasmodial and cytotoxic activities of organic and aqueous extracts of selected plants used by Embu traditional medicine practitioners to treat malaria.", "matches": {"물·열수 추출물": "aqueous extract"}}, {"location": "abstract", "section": "", "text": "In this study, aqueous extracts of T. brownii and S. africana demonstrated high antiplasmodial activity and high selectivity indices values (SI ≥ 10) and were found to be safe.", "matches": {"물·열수 추출물": "aqueous extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 766.7695149078385, "y": 208.4665453652456, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:1e48114f710a23b2", "kind": "paper", "name": "Hepatoprotective Effect of Pericarpium zanthoxyli Extract Is Mediated via Antagonism of Oxidative Stress", "title": "Hepatoprotective Effect of Pericarpium zanthoxyli Extract Is Mediated via Antagonism of Oxidative Stress", "doi": "10.1155/2020/6761842", "folder": "PMC7368226", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P6", "section": "2. Materials and Methods / 2.2. Preparation of PZE", "text": "Pericarpium zanthoxyli was obtained from Daewon Pharmacy (located in Daegu, Republic of Korea), and a voucher specimen (number: DHU-GHFM78) was stored in Daegu Haany University (Republic of Korea). PZE was prepared by extracting 100 g of P. zanthoxyli in 1.2 liter of boiling water for 3 h. The PZE was filtered using a 0.22 μ m filter (Nalgene, Rochester, NY, USA), lyophilized by a vacuum evaporator, and deposited at −20°C until use. The yield of lyophilized PZE was 14.5%. The ultra-performance liquid chromatography (UPLC) profile of PZE was analyzed using a Waters ACQUITY UPLC system (Waters Corp., Milford, MA, USA) with a Waters ACQUITY photodiode array detector and Waters ACQUITY BEH C18 column (1.7 μ m, 2.1 mm × 100 mm) assisted by the Empower software ( Figure 1 ). The PZE includes hyperoside (21.047 ± 0.53 μ g/g), 7-methoxycoumarin (19.395 ± 0.63 μ g/g), bergapten (2.816 ± 0.096 μ g/g), and xanthoxylin (1.756 ± 0.043 μ g/g).", "score": 11}], "note": "물 3시간 전탕", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1043.4157738035785, "y": 230.12896721764494, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:8fad542735f13630", "kind": "paper", "name": "In Vitro Antimicrobial and Antiproliferative Activities of the Root Bark Extract and Isolated Chemical Constituents of Zanthoxylum paracanthum Kokwaro (Rutaceae", "title": "In Vitro Antimicrobial and Antiproliferative Activities of the Root Bark Extract and Isolated Chemical Constituents of Zanthoxylum paracanthum Kokwaro (Rutaceae", "doi": "10.3390/plants9070920", "folder": "PMC7412065", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum paracanthum"], "category": "기타 유기용매 추출물", "types": ["기타 유기용매 추출물"], "evidence": [{"location": "body:P21", "section": "3. Materials and Methods / 3.3. Extraction, Isolation and Elucidation of Compounds", "text": "The ground root bark (960 g) of Z. paracanthum was exhaustively extracted for 72 h with dichloromethane:Methanol (CH 2 Cl 2 :CH 3 OH) (1:1). The resultant extract was filtered and the solvent removed in vacuo to give 128 g of the crude extract. A portion of this extract (77 g) was partitioned between CH 2 Cl 2 and water, followed by ethyl acetate (EtOAc) and water. Removal of the organic solvents yielded 45 g of CH 2 Cl 2 and 3 g of EtOAc extracts. The CH 2 Cl 2 extract (45 g) was subjected to column chromatography on silica gel (700 g) and eluted with n -hexane containing increasing amounts of EtOAc (1%, 2%, 4%, 6%, 8%, 10%, 15%, 20%, 30%, …90% and 100%) and then with EtOAc containing increasing amounts of CH 3 OH (5%, 10%, 20%, …100%). A total of 220 fractions, each 400 mL, were collected and combined on the basis of thin layer chromatography (TLC) analysis. The fractions eluted with 1% to 3% EtOAc in n -hexane were not followed further. The fractions eluted with 4% EtOAc in n -hexane were combined and further purified by column chromatography on Sephadex LH-20 (eluent: CH 2 Cl 2 /CH 3 OH, 1:1) to yield compound 1 (50 mg). The fractions eluted at 6–10% EtOAc in n -hexane were combined, then separated by column chromatography over silica gel eluting with n -hexane (EtOAc, 4:1) to yield compound 2 (100 mg), compound 3 (320 mg) and compound 4 (101 mg). The fractions obtained at 12% EtOAc were combined and crystallized to give compound 5 (42 mg). The eluents obtained with 15–70% EtOAc in n -hexane were combined and purified on Sephadex (eluent: CH 2 Cl 2 /CH 3 OH, 1:1) to afford compound 6 (68 mg), compound 7 (10 g) and compound 8 (54 mg). The EtOAc extract (3 g) was not followed further. The structures of the purified compounds were determined using nuclear magnetic resonance (NMR), spectroscopy, mass spectrometry and comparison with the literature.", "score": 11}], "note": "DCM:MeOH 1:1 조추출물 및 분리 성분. 용매 혼합물을 복수 유형으로 세지 않음", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 821.8262661347345, "y": 373.2446210439777, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:d751823ea9f3c360", "kind": "paper", "name": "Antibacterial activity of plant species used for oral health against Porphyromonas gingivalis.", "title": "Antibacterial activity of plant species used for oral health against Porphyromonas gingivalis.", "doi": "10.1371/journal.pone.0239316", "folder": "PMC7544490", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["Pistacia", "Zanthoxylum armatum"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P5", "section": "Materials and methods / Plant materials", "text": "For aqueous extractions, samples were extracted in Type II distilled water at a ratio of 1 g plant material:10 mL H 2 O and boiled for 20 minutes.", "matches": {"물·열수 추출물": "aqueous extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 871.5724738871392, "y": 140.08369536114995, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:d59415423936c205", "kind": "paper", "name": "The Japanese Extracted Herbal Medicine Daikenchuto Increases the Contractile Activity of the Internal Anal Sphincter Muscle in Conscious Dogs", " oon) compared to the deposited specimens. The preparation of the hydroethanolic extracts was conducted as previously reported [ 5 ]. Briefly, air-dried and powdered samples (100 g) were extracted using a 70% hydroethanolic mixture at room temperature and in dark conditions. The mixture was filtered, concentrated under reduced pressure, and frozen to give crude extracts. They were then lyophilized and stored at −20 °C. Spice extract stock solutions (100 mg/mL) dissolved in DMSO were prepared, aliquoted, and kept at −80 °C. The stock solution of spice extracts in DMSO was diluted in culture medium to the appropriate concentrations for cell treatments. For more details, please check Table 1 in [ 7 ]. The same concentration of DMSO (in any case never exceeding 0.1%) was also added to all control cultures.", "score": 11}], "note": "70% hydroethanolic 추출 명시", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1052.8867624685001, "y": 246.04092470454302, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:5bafe79fadd8dd34", "kind": "paper", "name": "Formation and Physical Stability of Zanthoxylum bungeanum Essential Oil Based Nanoemulsions Co-Stabilized with Tea Saponin and Synthetic Surfactant.", "title": "Formation and Physical Stability of Zanthoxylum bungeanum Essential Oil Based Nanoemulsions Co-Stabilized with Tea Saponin and Synthetic Surfactant.", "doi": "10.3390/molecules26247464", "folder": "PMC8707892", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Formation and Physical Stability of Zanthoxylum bungeanum Essential Oil Based Nanoemulsions Co-Stabilized with Tea Saponin and Synthetic Surfactant.", "matches": {"정유·휘발성 오일": "Essential Oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 .2. Agarwood Powder Fermentation", "text": "Agarwood pieces were smashed in a grinder and filtered through a 1 mm molecular sieve. Then, 0.3 g of Agarwood powder was mixed in sterilized saline for determination of degradation. Each 10 mL of the above mixture was added into two test tubes with stoppers, and then 10 µL of bacteria Bs-2 and Bs-4 respectively was added. The suspension was thoroughly mixed and incubated under shaking conditions (200 rpm, 37 °C). Samples were taken at 0 h, 24 h, and 48 h and filtered through a 0.22 µm filter membrane and determined by HPLC system (Shimazu, Kyoto, Japan) equipped with a C18 column and a SPD-20A UV detector at 252 nm. The column temperature was 30 °C and the mobile phase was composed of acetonitrile and 0.1% formic acid, and the detection was carried out by gradient elution at a flow rate of 0.7 mL/min. During the gradient elution process, the proportion of 0.1% formic acid solution in the mobile phase changed with time, and the settings were as follows: 0–5 min, 100–90%; 5–10 min, 90–85%; 10–25 min, 85–80%; 25–35 min, 80–70%; 35–50 min, 70–65%; 50–60 min, 65–55%; 60–70 min, 55–45%; 70–80 min, 45–35%; 80–90 min, 35–30%; 90–100 min, 30%; 100–120 min, 100%. The column was maintained at 30 °C.", "score": 6}], "note": "침향분말의 Bacillus 배양·발효액. ethanol 표면소독과 구분", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1011.2590128919575, "y": 357.03908199150936, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:26936913f8fca389", "kind": "paper", "name": "In vitro antimycobacterial activity of medicinal plants Lantana camara , Cryptolepis sanguinolenta , and Zanthoxylum leprieurii .", "title": "In vitro antimycobacterial activity of medicinal plants Lantana camara , Cryptolepis sanguinolenta , and Zanthoxylum leprieurii .", "doi": "10.1016/j.jctube.2022.100307", "folder": "PMC8904236", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum leprieurii"], "category": "메탄올·함수메탄올 추출물", "types": ["메탄올·함수메탄올 추출물"], "evidence": [{"location": "abstract", "section": "", "text": "Crude methanolic extracts, obtained from the leaves of L. camara, roots of C. sanguinolenta, and stem barks of Z. leprieurii, were tested for antimycobacterial activity against M. smegmatis (mc2155), pan-sensitive (H37Rv), and rifampicin-resistant (TMC-331) M. tuberculosis, using visual Resazurin Microtiter Assay (REMA) on 96 well plates.", "matches": {"메탄올·함수메탄올 추출물": "methanolic extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 744.5698712884412, "y": 261.0080955292579, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:f1d4288c13a82b74", "kind": "paper", "name": "Spectrum-Effect Relationship Analysis of Bioactive Compounds in Zanthoxylum nitidum (Roxb.) DC. by Ultra-High Performance Liquid Chromatography Mass Spectrometry Coupled With Comprehensive Filtering Approaches.", "title": "Spectrum-Effect Relationship Analysis of Bioactive Compounds in Zanthoxylum nitidum (Roxb.) DC. by Ultra-High Performance Liquid Chromatography Mass Spectrometry Coupled With Comprehensive Filtering Approaches.", "doi": "10.3389/fphar.2022.794277", "folder": "PMC8959880", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum nitidum"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P6", "section": "Materials and Methods / Preparation of Zanthoxylum nitidum (Roxb.) DC. Extracts", "text": "After being ground into powder and air-dried (filtered with a 50-mesh sieve), each ZN sample (5 g) was dissolved with 100 ml of 80% ethanol and extracted three times at 3, 2, and 1 h on a water bath at 80°C. Then a Rotavapor OSB-2200 from EYELA Co. (Tokyo, Japan) was used to remove the solvent. The extracts were powdered by an FD5-series vacuum freeze dryer (GOLD SIM, Newark, NJ, United States) and then stored for use.", "score": 11}], "note": "80% 에탄올 반복 추출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1017.9694998542199, "y": 178.56308051720174, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:6551a2e0220efd74", "kind": "paper", "name": "A methanolic extract of Zanthoxylum bungeanum modulates secondary metabolism regulator genes in Aspergillus flavus and shuts down aflatoxin production.", "title": "A methanolic extract of Zanthoxylum bungeanum modulates secondary metabolism regulator genes in Aspergillus flavus and shuts down aflatoxin production.", "doi": "10.1038/s41598-022-09913-3", "folder": "PMC8994782", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "메탄올·함수메탄올 추출물", "types": ["메탄올·함수메탄올 추출물"], "evidence": [{"location": "title", "section": "", "text": "A methanolic extract of Zanthoxylum bungeanum modulates secondary metabolism regulator genes in Aspergillus flavus and shuts down aflatoxin production.", "matches": {"메탄올·함수메탄올 추출물": "methanolic extract"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 881.6748212422758, "y": 396.67903567624865, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:b96057c4a9f72d66", "kind": "paper", "name": "Preparation of an Antimicrobial and Antioxidant Bio-Polymer Film and Its Application as Glazing Shell for Postharvest Quality of Fresh-Cut Apple.", "title": "Preparation of an Antimicrobial and Antioxidant Bio-Polymer Film and Its Application as Glazing Shell for Postharvest Quality of Fresh-Cut Apple.", "doi": "10.3390/foods11070985", "folder": "PMC8997500", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "body:P4", "section": "2. Materials and Methods / 2.1. Preparation of the Casting Solutions", "text": "Whole herbs of two Zanthoxylum species, i.e., Z. acanthopodium (ZA) and Z. simulans (ZS) were, respectively, collected from Hunan Province and Yunnan Province, China. Their aerial parts were dried at 50 °C for 48 h. The materials were subjected into a Clevenger-type apparatus (Kesijia Ltd., Beijing, China) for 6 h of hydrodistillation [ 10 ]. Extracts were collected and the main components were analyzed using a GC-MS system (6890-5975, Agilent Technologies, Santa Clara, CA, USA) equipped with HP-5 MS fused silica capillary column [ 11 ].", "score": 11}], "note": "Clevenger hydrodistillation 6시간", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 808.723416601993, "y": 157.2117482172976, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:92fc4245ea904684", "kind": "paper", "name": "Histological changes of cervical tumours following Zanthoxylum acanthopodium DC treatment, and its impact on cytokine expression.", "title": "Histological changes of cervical tumours following Zanthoxylum acanthopodium DC treatment, and its impact on cytokine expression.", "doi": "10.1016/j.sjbs.2021.12.065", "folder": "PMC9073070", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum acanthopodium"], "category": "메탄올·함수메탄올 추출물", "types": ["메탄올·함수메탄올 추출물"], "evidence": [{"location": "body:P5", "section": "Material and methods / Preparation of the Z. acanthopodium methanolic extract (ZAM)", "text": "Z. acanthopodium fruits were cleaned of any soil or dust that had adhered to the fruit. Three steps were used to create the fruit extract. First, the andaliman fruit was cleaned and drained until dry, then mashed in a blender. Second, the ZAM extract was made by macerating the fruit in a 96% methanol solvent overnight. It was then percolated until it was clear. The concentrated liquid was then evaporated to obtain the powder extracts. Finally, as the extract does not dissolve completely in water, a homogeneous mixture was obtained by mixing 1–1.5% (1 mL) of the suspending agent CMC in 150 mL of distilled water. The dregs were washed with the 96% methanol solvent before being transferred to a closed container and stored in a cool, dark place for two days. Methanol extract was used as it was able to identify 20 chemical compounds in the fruit. Sixteen of the chemical compounds were derived from terpenes and terpenoids. The other four compounds were identified structurally as aliphatic derivatives (neoherculin, ethyl linoleate, ethanol,2-(3,3-dimethylcyclohexylidene), and 9,12-Octadecadienoyl chloride; ( Sibero et al., 2020 ).", "score": 11}], "note": "96% 메탄올 침출; 물/CMC는 투여용 매질", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1053.204843956999, "y": 292.1144827628802, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:d2c4ffc589f8e189", "kind": "paper", "name": "Characterization of Zanthoxylum rhoifolium (Sapindales: Rutaceae) Essential Oil Nanospheres and Insecticidal Effects to Bemisia tabaci (Sternorrhyncha: Aleyrodidae).", "title": "Characterization of Zanthoxylum rhoifolium (Sapindales: Rutaceae) Essential Oil Nanospheres and Insecticidal Effects to Bemisia tabaci (Sternorrhyncha: Aleyrodidae).", "doi": "10.3390/plants11091135", "folder": "PMC9101351", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum rhoifolium"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Characterization of Zanthoxylum rhoifolium (Sapindales: ol (ratio sample: solvent; 1:10) in a water bath shaker at 50 °C for 3 h, and it was kept overnight in the dark at room temperature. The sample was filtered with filter paper to stop the maceration process and the 70% ethanol were separated from the sample with a rotary evaporator at 55–60 °C, 130–100 Bar, 55 rpm, until the ethanol separated and the sample was concentrated. The separated extract was dried overnight in the oven at 55 °C.", "score": 11}], "note": "70%에탄올 침출 추출물", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 783.2993723224465, "y": 357.9216031833403, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:1206780486bd1135", "kind": "paper", "name": "Chemical Composition and Antifungal Activity of Zanthoxylum armatum Fruit Essential Oil against Phytophthora capsici .", "title": "Chemical Composition and Antifungal Activity of Zanthoxylum armatum Fruit Essential Oil against Phytophthora capsici .", "doi": "10.3390/molecules27238636", "folder": "PMC9740196", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum armatum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Chemical Composition and Antifungal Activity of Zanthoxylum armatum Fruit Essential Oil against Phytophthora capsici .", "matches": {"정유·휘발성 오일": "Essential Oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 912.2255361103006, "y": 129.272507373607, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:042d3434da02bdad", "kind": "paper", "name": "The Metabolomic Profile of the Essential Oil from Zanthoxylum caribaeum (syn. chiloperone ) Growing in Guadeloupe FWI using GC × GC-TOFMS.", "title": "The Metabolo 1063.9713698682074, "y": 301.5352934440687, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:44c08357699c9489", "kind": "paper", "name": "Zanthoxylum piperitum alleviates bone loss in osteoporosis via inhibition of RANKL-induced c-fos/NFATc1/NF-κB pathway", "title": "Zanthoxylum piperitum alleviates bone loss in osteoporosis via inhibition of RANKL-induced c-fos/NFATc1/NF-κB pathway", "doi": "10.1016/j.phymed.2020.153397", "folder": "PMID_33130475", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P19", "section": "ZP preparation", "text": "To prepare the extract of Zanthoxylum piperitum (ZP), 100 g of Zan­ thoxylum Fruit was reflux-extracted with 1 l of 50% ethanol for 4 h. The extract was concentrated under decompression and powdered by freezing dryer at � 80 ◦C for 72 h. 11 g of ZP was obtained, resulting in 11% final yield of ZP. A voucher specimen (Osteo-ZPE050-1507) was deposited at Department of Convergence Korean Medical Science, Col­ lege of Korean Medicine, Kyung Hee University, Seoul, Republic of Korea. We conducted a Ultraperformance liquid chromatography coupled with electrospray ionization tandem quadrupole time-of-flight mass spectrometry (UPLC-ESI-QTOF MS/MS) analysis of the extract to determine the chemical profile and identify the major constituents from the extract of ZP. Approximately 50 mg of the extract power was shaken with 1 ml of 70% ethanol by a vortex mixer for 30 s and sonicated for 10 min. The supernatants were filtered through a 0.2-μm hydrophilic pol­ ytetrafluoroethylene syringe filter (Thermo Scientific). Finally, the filtrate was diluted in a finally 4-fold diluted concentration and trans­ ferred to a LC sample vial before use. The liquid chromatography-mass spectrometry system consisted of a Thermo Scientific Vanquish UHPLC system (Thermo Fisher Scientific, Sunnyvale, CA, USA) with an Waters Xselect HSS column (4.6 mm × 150 mm, 2.5 μm; Waters) and a Triple TOF5600+ mass spectrometer system (QTOF MS/MS, SCIEX, Foster City, CA, USA). The QTOF MS was equipped with an electro spray ionization (ESI) source and used to complete the high-resolution experiment. The elution program for UHPLC separation used 0.1% for­ mic acid in water as eluent A and 0.1% formic acid in acetonitrile as eluent B was as follows: 0-20 min; 20% B, 20-40 min; 20-35% B, 40-44 min; 35-100% B, 44-49 min; 100% B and equilibration with 20% B for 5 min at a flow rate of 0.5 ml/min. The column was at 25 ◦C and the auto-sampler was maintained at 4 ◦C. The injection volume of each sample solution was 1 μl. Data acquisition and processing for qualitative analysis were carried out using Analyst TF 1.7, PeakVeiw2.2 and Mas­ terView (SCIEX, Foster City, CA, USA). Finally, 120 0.323% of hypero­ side and 0.186% of quercitrin were found in ZP. The MS/MS data for qualitative analysis were processed using PeakView and MasterView software to screen the probable metabolites based on accurate mass and isotope distribution. The chromatogram shows representative compo­ nents in the extract (Fig. S1; Table S1)."}], "note": "50% 에탄올 환류 추출; 분석용 70% 에탄올 재용해와 구분", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 749.8569858284084, "y": 332.29711720296444, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:07f8592de0253e24", "kind": "paper", "name": "Zanthoxylum bungeanum Seed Oil Elicits Autophagy and Apoptosis in Human Laryngeal Tumor Cells via PI3K/AKT/mTOR Signaling Pathway.", "title": "Zanthoxylum bungeanum Seed Oil Elicits Autophagy and Apoptosis in Human Laryngeal Tumor Cells via PI3K/AKT/mTOR Signaling Pathway.", "doi": "10.2174/1871520621666210401103820", "folder": "PMID_33797380", "fields": ["산초류"], "field": "산초류", "plant_labels": [" statistician generated the randomization codes (employing a permuted block design with a block size of 4) using the Jamovi (2022, Version 2.3) and R programming (2021, Version 4.1) software. To ensure impartiality in the randomization process, the block size was disclosed only to the trial statistician until the statistical analysis was completed. The randomization code list was centrally maintained by the sponsor designee and was distributed to the site coordinator in a concealed envelope, with instructions to unblind only at the discretion of PI and sponsor. The blinding and labelling were carried out by the unblinded personnel. The study products were packaged in identical containers, and each labelled a randomization code. The sponsor, clinical research organization, PIs, study personnels, site staff and participants were all blinded in the study. At visit 2 (Day 01), the PI randomly assigned eligible participants in a 1:1 ratio to WDTE60N (TurmXTRA ® 60N: 250 mg natural, water-dispersible turmeric extract capsules containing 60% natural curcuminoids, manufactured by Nutriventia Limited, Mumbai, India, and Laila Nutraceuticals, India) or placebo (identical capsules that matched the color, size, and shape of the WDTE60N, but without active, manufactured by Nutriventia Limited, Mumbai, India). The participants were provided 33 capsules of either WDTE60N or placebo for 30 ± 3 days on days 1, 30, and 60. They were instructed to take one capsule orally once daily in the morning after breakfast, with adequate water. All participants were followed up at different interim time points, starting from visit 3 (Day 3 ± 1) until the end of the study (visit 9 [Day 90 ± 3]) ( Figure 1 ). Additionally, all participants were provided with a diary to maintain a daily log of study product administration and record any adverse events (AE) experienced during the study period. Treatment compliance and monitoring of treatment-emergent adverse events (TEAEs) for each participant were a : "Methods / Study intervention", "text": "Generic paracetamol 650 mg and bioavailable turmeric extract were the study interventions used. Turmeric extract (BCM-95®) was provided as 500 mg zero size hard gelatin capsule (Curcugreen® from Arjuna Natural Pvt. Ltd., India). BCM-95® contains a combination of curcuminoids (curcumin, demethoxycurcumin, bisdemethoxycurcumin) with essential oil of turmeric rich in ar-turmerone, which makes it more bioavailable. Each capsule contained curcuminoids and essential oil complex total not less than 95%, curcuminoids not less than 88%, and curcumin not less than 68%. It has been characterized using ultra-performance liquid chromatography (UPLC) and Fourier transform near-infrared ( FT-NIR ) spectrometer (Additional file 1 ).", "score": 6}], "note": "curcuminoids와 essential oil의 복합제제", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1230.7850626998058, "y": 471.0572696178152, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:66826f2d3d586a57", "kind": "paper", "name": "Acute Effects of Turmeric Extracts on Knee Joint Pain: A Pilot, Randomized Controlled Trial.", "title": "Acute Effects of Turmeric Extracts on Knee Joint Pain: A Pilot, Randomized Controlled Trial.", "doi": "10.1089/jmf.2020.0074", "folder": "PMC8080919", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P2", "section": "Introduction", "text": "B-Turmactive ® (constituted by Turmacin ® and curcuminoid Betasorb ® ) is a new formulation of dry extracts of turmeric roots ( Supplementary Data S1 ). It is a combination of the water-soluble fraction of TEs, supposedly the main beneficial constituent of turmeric in its traditional use, with insoluble curcuminoids, with clinical anti-inflammatory effects, 4 together with beta-cyclodextrin (E 429) in an inclusion complex. The intention of joining these two fractions of the plant is to mimic the composition of the active ingredients of the native plant as well as improve curcuminoid bioavailability. Both fractions have anti-inflammatory activity with expected different and complementary mechanisms of action. The aim of the present study was to assess the acute effects (from 3 days to 1 week) of B-Turmactive on human knee joint pain (KJP)."}, {"location": "body:P5", "section": "Introduction", "text": "A pilot, randomized, parallel, double-blind, placebo-controlled clinical trial was conducted with B-Turmactive (500 mg of TEs combined with 19.5 mg of curcuminoid complex) or brewer's yeast (BY) (200 mg of heat-inactivated yeast together with 164 mg of excipients) as a placebo. The active constituents were 10–15% turmerosaccharides and 17–21% total curcuminoids ( Supplementary Data S2 ). The qualitative testing procedures are described in Supplementary Data S3 . Participants ingested 1 capsule/day for 1 week. The randomized allocation sequence to the treatment or placebo group was at a ratio of 1:1 and it was generated with G*Power 3.1 (© 2010–2018 Heinrich-Heine-Universität Düsseldorf) 10 by an independent researcher with no clinical involvement in the trial. Blinding was maintained by using identical opaque envelopes for B-Turmactive and the placebo. They were dispensed in opaque sealed envelopes and sequentially numbered by codes 111 and 222 according to the randomization schedule. Both participants and researchers were blinded to the allocation until the end of the intervention."}], "note": "수용성 분획과 curcuminoid 복합. 수용성은 물 추출 근거 아님; 제조용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1264.845507606482, "y": 314.8085208639999, "anchor": [128  Pain of the Knee: A Randomised, Double-Blind, Placebo-Controlled Study.", "doi": "10.3390/nu14010041", "folder": "PMC8746505", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P8", "section": "2. Materials and Methods / 2.5. Interventions", "text": "Curcumin and placebo capsules were identical in appearance, being matched for colour coating, shape, and size. The active treatment, supplied by DolCas Biotech, LLC., contained 500 mg of a standardised curcuminoids extract (Curcugen ® ) in each capsule. Curcugen ® is a dispersible, 98.5% turmeric-based ingredient, containing 50% curcuminoids, 1.5% essential oils, and other native turmeric molecules, including turmeric polysaccharides. The placebo capsules contained the same excipients as the active capsules (microcrystalline cellulose). All participants were instructed to take 1 capsule, twice daily, with food, for 8 weeks. Capsule adherence was assessed by asking participants to provide an estimate of the consistency of capsule intake every week and a count of returned capsules at week 8 was also conducted. Treatment blinding was assessed by asking participants to predict group allocation (placebo, curcumin, or unsure) at the end of the study. All capsule bottles were provided to participants with instructions for use provided on the bottles. An information sheet about curcumin and what to do if a dose was missed was also given to participants. This information was also verbally conveyed to participants during their initial in-person assessment.", "score": 6}], "note": "50% curcuminoids 표준화 추출물. 정유는 천연 공존성분으로 기재되어 독립 정유추출로 중복 분류하지 않음; 제조용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "O", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1172.7293603481817, "y": 409.1496449836527, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:ffda8436f2656a9d", "kind": "paper", "name": "Curcuma longa and Boswellia serrata Extracts Modulate Different and Complementary Pathways on Human Chondrocytes In Vitro: Deciphering of a Transcriptomic Study.", "title": "Curcuma longa and Boswellia serrata Extracts Modulate Different and Complementary Pathways on Human Chondrocytes In Vitro: Deciphering of a Transcriptomic Study.", "doi": "10.3389/fphar.2022.931914", "folder": "PMC9403192", "fields": ["강황류", "보스웰리아류"], "field": "강황류 · 보스웰리아류", "plant_labels": ["Curcuma·강황", "Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P4", "section": "Material and Methods / Study Medication", "text": "C. longa extract (CL, containing 89.6% of curcumin and 9.1% of demethoxycurcumin) and B. serrata oleoresin (BS, containing 2.83% 3-acetyl-11-keto-β-boswellic acid, 4.35% 11-keto-β-boswellic acid, 10.17% α-boswellic acid, 15.5% β-boswellic acid, 2.24% acetyl α-boswellic acid, and 6.63% acetyl-β boswellic acid) were used. These extracts were provided by Tilman SA (Belgium) and stored at ambient temperature, protected from light. Before use, the extracts were solubilized in tetrahydrofuran at 4 mg/ml (CL) or 100 mg/ml (BS). They were further diluted in tetrahydrofuran to achieve a final 0.1% of solvent in each culture condition. We evaluated two concentrations for each extract, corresponding to the minimal and the maximal concentrations of the active compounds found in the plasma after oral treatment with these extracts ( Buchele and Simmet 2003 ; Henrotin et al., 2013 ).", "score": 6}], "note": "curcuminoid 및 boswellic acid 함량 표준화 추출물; THF는 용해용", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1360.2887926672213, "y": 328.35122938149755, "anchor": [1283.0974264093347, 400.54367133 h 500 mg of active NR-INF-02 containing 12.6 % w/w polysaccharides as determined by high pressure liquid chromatography (HPLC) described by Gomis et al. (2001).", "score": 6}], "note": "12.6% polysaccharide 표준화 NR-INF-02", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1200.1537690739067, "y": 324.18967248277545, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:cfe99fb9b4193930", "kind": "paper", "name": "The efficacy of Curcuma Longa L. extract as an adjuvant therapy in primary knee osteoarthritis: a randomized control trial.", "title": "The efficacy of Curcuma Longa L. extract as an adjuvant therapy in primary knee osteoarthritis: a randomized control trial.", "doi": "", "folder": "PMID_23964444", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P17", "section": "Material and Method", "text": "The authors did the double blind prospective randomized control trial by dividing patients into 2 groups. The first group (44 patients) was assigned for receiving placebo (with identical to the curcuminoid capsule) 2 caps per oral bid pc and diclofenac 25 mg per oral tid pc for 3 months (group 1 = control group). The latter group was assigned to take curcuminoids capsules (250 mg) 2 caps per oral bid pc (manufactured by the Government Pharmaceutical Organization, each capsule contain tumeric extract equivalent to curcuminoids 250 mg) and diclofenac 25 mg per oral tid pc for 3 months (group 2 = experimental group).", "score": 6}], "note": "curcuminoids 250mg으로 표준화한 강황 추출 제제", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1408.5036754858788, "y": 409.4753696382535, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:2bbfbe90b0469840", "kind": "paper", "name": "Clinical evaluation of a formulation containing Curcuma longa and Boswellia serrata extracts in the management of knee osteoarthritis.", "title": "Clinical evaluation of a formulation containing Curcuma longa and Boswellia serrata extracts in the management of knee osteoarthritis.", "doi": "10.3892/mmr.2013.1661", "folder": "PMID_24002213", "fields": ["강황류", "보스웰리아류"], "field": "강황류 · 보스웰리아류", "plant_labels": ["Curcuma·강황", "Boswellia·보스웰리아"], "category": "복수 추출물 유형", "types": ["분획·농축·표준화 성분군", "정유·휘발성 오일"], "evidence": [{"location": "body:P20", "section": "Materials and methods", "text": "Study design. The CB formulation consisted of 350 mg Curcuma longa extract (BCM 95 ® , Arjuna Natural Extracts Ltd, Aluva, Kerala, India) containing 70% curcumin, 17% demethoxycurcumin, 3.5% bis-demethoxycurcumin and 7.5% turmeric essential oils and 150 mg Boswellia serrata extract (BosPure ® , Arjuna Natural Extracts Ltd, Aluva, Kerala, India) containing 75% boswellic acids and 10% AKBA in 500-mg hard gelatin capsules. The study was performed at the Anugraha Medical Centre, Kochi, India as a two arm clinical There is a statistically significant difference between joint pain at the baseline compared with pain at the end of the study within the groups (P\u003c0.05). At the start of the study, 11 subjects in Group I and 10 subjects in Group II presented with a 'moderate' joint pain. Following treatment with CB formulation for three months, only three patients were classified as having a 'moderate' joint pain in Group I, while eight subjects in Group II had 'moderate' joint pain status even following treatment with celecoxib. CB, a formulation containing Curcuma longa and Boswellia serrata extracts.", "score": 6}], "note": "curcuminoids·boswellic acids 농축군과 turmeric essential oil 복합", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1180.7742517030745, "y": 467.7715879515514, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:8c25b5d026ced8a1", "kind": "paper", "name": "Curcuma longa extract reduces inflammatory and oxidative stress biomarkers in osteoarthritis of knee: a four-month, double-blind, randomized, placebo-controlled trial.", "title": "Curcuma longa extract reduces inflammatory and oxidative stress biomarkers in osteoarthritis of knee: a four-month, double-blind, randomized, placebo-controlled trial.", "doi": "10.1007/s10787-016-0289-9", "folder": "PMID_27761693", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P21", "section": "Study products", "text": "Each capsule composed of CL extract, which was standardized and extracted using organic solvent and then evaporated at low pressure to obtain a semisolid containing curcuminoids. The extract contained equal to or more than 95 % of total curcuminoids. The standardized CL extract was blended with rhizome powder uniformly and was processed by wet granulation method. The wet granules formed were dried in fluidized bed dryer and sizing was done to obtain uniform size of granules and the same was filled in vegetable hydroxypropyl methyl cellulose (HPMC) capsule shells. The final capsules were filled into the high density polyethylene (HDPE) containers, which served as primary packing.", "score": 2}], "note": "95% 이상 curcuminoids 추출물과 원물분말 배합; 유기용매 종류는 미명시", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1305.6990432260209, "y": 289.3817655888033, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:4981173990035d7c", "kind": "paper", "name": "A Placebo-Controlled Double-Blind Study of a Novel Herbal Formulation in Osteoarthritis of Knee", "title": "A Placebo-Controlled Double-Blind Study of a Novel Herbal Formulation in Osteoarthritis of Knee", "doi": "10.1089/jmf.2017.0065", "folder": "PMID_29708818", "fields": ["강황류", "기타 식물", "보스웰리아류"], "field": "강황류 · 기타 식물 · 보스웰리아류", "plant_labels": ["Curcuma·강황", "Boswellia·보스웰리아", "Terminalia"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "알코올 추출(종류 미명시)", "분획·농축·표준화 성분군"], "evidence": [{"location": "body:P17", "section": "MATERIALS AND METHODS", "text": "LI73014F2 is a synergistic composition comprising aqueous extract of T. chebula fruit, alcohol extract of C. longa rhizome, and B. serrata extract at 2:1:2 ratio. B. serrata extract contains the acidic and nonacidic fractions in 1:1 ratio. The finished formulation was standardized to a minimum of 1% gallic acid, 0.5% ellagic acid, 2.0% total curcuminoids, and 0.6% 3-O-acety-11-keto-β-boswellic acid (AKBA). Gallic acid and ellagic acid are unique phytochemical markers for T. chebula fruit raw material. Curcuminoids and AKBA are unique phytochemical markers for C. longa rhizome and B. serrata resin raw materials, respectively. These markers concentrations were adopted as specification limits for maintaining the consistent quality of the formulation across the batches of LI73014F2. These limits were developed based on the data from several manufacturing lots of the formulation. The problem of geographic and climatic variations of secondary metabolites in raw materials was addressed by developing a raw material specification with a specific limit for unique marker for each of the individual ingredients in LI73014F2. Each batch was evaluated for consistency in quality by the compliance of marker compound concentration to the specification limit.", "score": 11}], "note": "수추출·알코올추출·보스웰리아 분획의 복합제", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1356.5567029347078, "y": 497.85297070048387, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:20f9cb0066a953fe", "kind": "paper", "name": "Herbal formulation \"turmeric extract, black pepper, and ginger\" versus Naproxen for chronic knee osteoarthritis: A randomized, double-blind, controlled clinical trial.", "title": "Herbal formulation \"turmeric extract, black pepper, and ginger\" versus Naproxen for chronic knee osteoarthritis: A randomized, double-blind, controlled clinical trial.", "doi": "10.1002/ptr.6671", "folder": "PMID_32180294", "fields": ["강황류", "생강류"], "field": "강황류 · 생강류", "plant_labels": ["Curcuma·강황", "Zingiber·생강"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "parsed:I41", "section": "2.4 | Intervention and control", "text": "Investigators who had no clinical involvement in the trial used random allocation software to randomly assign patients by using blocked randomization with a fixed block size of 6 (Berger, 2006), so two groups were determined: Herbal formulation (n = 30) and Naproxen (n = 30). Individuals were studied for 4 weeks. The administered capsules in Herbal formulation group contained curcumin (300 mg), gingerols (7.5 mg), and piperine (3.75 mg) which were taken twice a day after meals. The extracted herbal formulation was produced under supervision according to the standard procedure of pharmaceutical materials; ethyl acetate was used to preserve antioxidant capacity of selected agents (de Lima et al., 2018). Due to blinding policy, Naproxen tablets were converted to capsules in the lab. Naproxen group received 250 mg capsules twice in the morning and night (Essex, O'Connell, Behar, & Bao, 2016). A weekly calling was done to remind participants for taking related drugs.", "score": 2}], "note": "curcumin·gingerols·piperine 정량 복합제형. ethyl acetate 사용 언급만으로 전체 원료 제조법 확정하지 않음", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1148.4797820023662, "y": 370.267004448385, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:ba65140267c46432", "kind": "paper", "name": "Influence of a low-dose supplementation of curcumagalactomannoside complex (CurQfen) in knee osteoarthritis: A randomized, open-labeled, active-controlled clinical trial.", "title": "Influence of a low-dose supplementation of curcumagalactomannoside complex (CurQfen) in knee osteoarthritis: A randomized, open-labeled, active-controlled clinical trial.", "doi": "10.1002/ptr.6907", "folder": "PMID_33210408", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "parsed:I25", "section": "2.1 | Intervention", "text": "Hard-shell two-piece gelatin capsules of CGM (400 mg) were prepared using a modified method of Krishnakumar, Ravi, Kumar, Kuttan, and Maliakel (2012), by avoiding emulsifiers and employing high-pressure-mediated gel-phase homogenization technique. CGM comprised of curcuminoids (126.2 mg curcumin, 23.6 mg demethoxycurcumin, and 4.3 mg bisdemethoxycurcumin) encapsulated in fenugreek galactomannans (35:65 w/w ratio), as a novel amorphous, water dispersible, powder of curcumagalactomannoside complex. Standard drug capsules, CHN and GLN, were prepared as identical to the intervention capsules and consisted of 415 mg chondroitin sulphate (CHN) and 500 mg glucosamine hydrochloride (GLN), respectively. The intervention and standard drug capsules were provided, in high-density polyethylene (HDPE) containers labeled with separate codes and dosages, by M/s Akay Natural Ingredients, Cochin, India.", "score": 2}], "note": "curcuminoid와 호로파 galactomannan 35:65 제형. 용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1409.2143776915987, "y": 344.3306950466175, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:d05cf20170228847", "kind": "paper", "name": "Effect of Curcuma longa extract on serum inflammatory markers and MRI-based synovitis in knee osteoarthritis: secondary analyses from the CurKOA randomised trial.", "title": "Effect of Curcuma longa extract on serum inflammatory markers and MRI-based synovitis in knee osteoarthritis: secondary analyses from the CurKOA randomised trial.", "doi": "10.1016/j.phymed.2022.154616", "folder": "PMID_36610110", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P16", "section": "Study design", "text": "This study was a secondary analysis of the CurKOA trial (Australian New Zealand Clinical Trials Registry: ACTRN12618000080224) (Wang et al., 2020). In brief, participants with symptomatic knee OA defined by the American College of Rheumatology clinical criteria, knee pain of at least 40 mm on a visual analogue scale (VAS), and a moderate amount of ultrasonography-defined effusion-synovitis (≥4 mm effusion depth in the suprapatellar region) were included (D'Agostino, 2005). Partici­ pants were randomly assigned to CL (n =36, 1000 mg/day standardised extract containing turmerosaccharides and curcuminoids [8:2 wt/wt]) and placebo (n = 34) over 12 weeks. The original study protocol and sub-study protocol were approved by the Southern Tasmania Health and Medical Human Research Ethics Committee (reference NO. H0016713 and H0017132). All participants gave their written informed consent to participate in the study and that the data will be published."}], "note": "turmerosaccharides:curcuminoids8:2 표준화 추출물. 제조용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1233.7277441436333, "y": 516.8728187943694, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:6962bbe8fe245890", "kind": "paper", "name": "Efficacy of GV22202 in subjects with mild knee osteoarthritis: A randomized, triple arm trial.", "title": "Efficacy of GV22202 in subjects with mild knee osteoarthritis: A randomized, triple arm trial.", "doi": "10.1016/j.explore.2026.103473", "folder": "PMID_42480396", "fields": ["강황류"], "field": "강황류", "plant_labels": ["Curcuma·강황"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P19", "section": "Investigational product", "text": "GV22202, also marketed as CurQ60 Ⓡ or CURQFLEX Ⓡ is a pro­ prietary, water-dispersible curcumin formulation (a yellowish-orange dry powder) manufactured by Laila Nutra Private Limited, Vijayawada, Andhra Pradesh, India. The material is a standardized extract derived from the rhizomes of Curcuma longa L. and is formulated to contain not less than 60% (w/w) total curcuminoids. Total curcuminoids are quantified by high-performance liquid chromatography (HPLC) using an ACQUITY UPLC H-Class system equipped with a photodiode array (PDA) detector with UV detection, and quantification performed against the reference standard LI01091 (a mixture of curcumin, demethox­ ycurcumin, and bisdemethoxycurcumin). Under these analytical con­ ditions, GV22202 was confirmed to contain 66.44% (w/w) total curcuminoids by HPLC. GV22202 is formulated with excipients that are Generally Recognized as Safe (GRAS) and contains no synthetic surfac­ tants. The formulation exhibits excellent water dispersibility, enabling rapid dispersion upon reconstitution and facilitating improved absorption following oral administration. The enhanced dispersion profile is expected to improve physicochemical stability and expand formulation flexibility across a range of dosage forms. The improved bioavailability of GV22202 is attributed its composition of natural in­ gredients that enhance both the solubility and permeability of the poorly water-soluble & poorly permeable active compound. The formulation improves dissolution of the curcuminoids in the gastrointestinal envi­ ronment while also facilitating enhanced permeation across the intes­ tinal membrane, resulting in increased permeation flux and systemic absorption. The combined enhancement in solubility and permeability is therefore considered the primary mechanism underlying the enhanced oral bioavailability observed with GV22202. Overall, the distinctive composition of GV22202 is intended to enhance curcuminoid dis­ persibility and bioavailability, thereby addressing the well-recognized solubility limitations of curcumin-based ingredients.", "score": 2}, {"location": "body:P22", "section": "Sample size, randomization blinding supplementation and compliance", "text": "Sample size was calculated by assuming the mean reduction in WOMAC scores by 41.85% and 9.23% in GV22202 and placebo arms, respectively at 95% CI, while satisfying 90% power with a non-response rate of 10%. Randomization was done using SAS PROC PLAN by an independent statistician who was blinded to the intervention protocols. An algorithm was employed to allocate participants to one of the three intervention groups, i.e. placebo, GV22202-200 mg or active compar­ ator � 1000 mg (Fig. 1). Participants in the GV22202 group were pro­ vided with two sets of intervention capsules, with one set comprising of GV22202 capsules (200 mg per capsule), while other set comprises of placebo capsules. Similarly, participants in the active comparator group were provided with two sets of capsules both filled with active comparator therapy, while the placebo group participants received two sets of placebo capsules. The active comparator group consisted of a currently marketed therapy comprising of 500 mg of C. longa extract standardized to 95% curcuminoids with 2.5 mg piperine combination per capsule, which is being marketed as Curcuminoid C3 Complex Ⓡ . All the participants were instructed to consume one capsule from the first capsule set in morning after breakfast and one capsule from the second capsule set in evening after dinner for 84 days. Both investigators and participants were blinded to group assignments, as the capsules and their containers were identical in appearance. The randomization codes were concealed and revealed only after completion of the statistical analysis. Participants in all three groups were instructed to consume two capsules daily, one in the morning and one in the evening after food for 84 days. Lifestyle changes, concomitant medication use, and any adverse events were monitored through regular telephone follow-ups. No participants required the use of rescue medication during the study period. Study visits were scheduled as follows: visit 1 (screening, 7 days prior to randomization), visit 2 (V2) (day 1, baseline visit), visit 3 (V3)", "score": 2}], "note": "60% 및95% curcuminoids 표준화제제 비교; 제조용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1225.8910212380404, "y": 284.04951466073464, "anchor": [1283.0974264093347, 400.54367133085594], "radius": 2.6, "color": "#885f34", "base_color": "#D59552"}, {"id": "paper:5ef6782148ebd960", "kind": "paper", "name": "Standardized Ethanolic Extracts of Boswellia serrata Ameliorate Symptoms of Osteoarthritis by Direct Effects on Chondrocytes", "title": "Standardized Ethanolic Extracts of Boswellia serrata Ameliorate Symptoms of Osteoarthritis by Direct Effects on Chondrocytes", "doi": "10.12691/jfnr-9-12-1", "folder": "DOI_10.12691_jfnr-9-12-1", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "title", "section": "", "text": "Standardized Ethanolic Extracts of Boswellia serrata Ameliorate Symptoms of Osteoarthritis by Direct Effects on Chondrocytes", "matches": {"에탄올·함수에탄올 추출물": "Ethanolic Extract"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1441.5570824614645, "y": 721.89399096318, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:ebb96a30ecd31059", "kind": "paper", "name": "SW1353 연골세포에서 기능 성분이 증대된 보스웰리아 검레진 추출물의 항골관절염 효과 연구", "title": "SW1353 연골세포에서 기능 성분이 증대된 보스웰리아 검레진 추출물의 항골관절염 효과 연구", "doi": "10.3746/jkfn.2023.52.5.460", "folder": "DOI_10.3746_jkfn.2023.52.5.460", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P20", "section": "보스웰리아 검레진 추출물의 제조", "text": "기존 추출 공정으로 제조한 보스 웰리아 검레진 에탄올 추출물의 KBA와 AKBA의 총함량은 59.73 mg/g으로 보고된다(Lee 등, 2021).", "matches": {"에탄올·함수에탄올 추출물": "에탄올 추출"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1309.402460049801, "y": 732.5592599705235, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:5c5ec53eb124152f", "kind": "paper", "name": "Evaluating the Anti-Osteoarthritis Potential of Standardized Boswellia serrata Gum Resin Extract in Alleviating Knee Joint Pathology and Inflammation in Osteoarthritis-Induced Models.", "title": "Evaluating the Anti-Osteoarthritis Potential of Standardized Boswellia serrata Gum Resin Extract in Alleviating Knee Joint Pathology and Inflammation in Osteoarthritis-Induced Models.", "doi": "10.3390/ijms25063218", "folder": "PMC10970542", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P25", "section": "4. Materials and Methods / 4.2. Preparation of BSRE", "text": "In a brief overview of the extraction process, Boswellia serrata gum resin was extracted with 95% ethanol at 60 °C for 6 h.", "matches": {"에탄올·함수에탄올 추출물": "extracted with 95% ethanol"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1409.2272971033194, "y": 639.4850693679996, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:938f167c02f34a4b", "kind": "paper", "name": "A standardized Boswellia serrata extract shows improvements in knee osteoarthritis within five days", "title": "A standardized Boswellia serrata extract shows improvements in knee osteoarthritis within five days", "doi": "10.3389/fphar.2024.1428440", "folder": "PMC11291344", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P3", "section": "2 Materials and methods / 2.1 Materials", "text": "Boswellin ® Super is a standardized extract of B. serrata containing not less than 30% 3-acetyl-11-keto- β-boswellic acid (AKBBA), 7.5% β-boswellic acid, 3.5% of 3-O-acetyl-β boswellic acid, and 1.5% 11-Keto-β-boswellic acid as analyzed by HPLC. The content of the total identified beta boswellic acids was between 50%–55% in the extract. BBA and ABBA are detected at 210 nm and KBBA and AKBBA at 254 nm. The HPLC chromatograms are shown in the Supplementary Figures S1A, B . Boswellin ® Super, henceforth termed (BSE), was formulated into tablets containing either 150 mg or 300 mg of BSE in two doses. Placebo capsules contained 300 mg of microcrystalline cellulose. All three tablets were of the same size, color, and weight. The standardized Boswellin ® Super FJ was provided by Sami-Sabinsa Group Limited.", "score": 6}], "note": "boswellic acids 50–55%, AKBBA 30% 이상으로 표준화한 성분군 추출물. 용매는 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1409.1075930793743, "y": 777.2902623278138, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:7dfcc93ae1d9d1d4", "kind": "paper", "name": "Efficacy and Safety of Boswellia serrata and Apium graveolens L. Extract Against Knee Osteoarthritis and Cartilage Degeneration: A Randomized, Double-blind, Multicenter, Placebo-Controlled Clinical Trial.", "title": "Efficacy and Safety of Boswellia serrata and Apium graveolens L. Extract Against Knee Osteoarthritis and Cartilage Degeneration: A Randomized, Double-blind, Multicenter, Placebo-Controlled Clinical Trial.", "doi": "10.1007/s11095-025-03818-2", "folder": "PMC11880083", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "함수알코올 추출물: 알코올 종류 미명시", "types": ["함수알코올 추출물: 알코올 종류 미명시"], "evidence": [{"location": "body:P5", "section": "Material and Methods / Investigational Product / Manufacturing and Quality Control of Investigational Product", "text": "The gum resin of Boswellia serrata and seed of Apium graveolens L. were freshly sourced and authenticated. Both materials were separately subjected to the pretreatment and extraction process. The dried material was extracted by reflux extraction with hydroalcoholic solvent. The extract layer was filtered through filter aids under vacuum pressure. The cycles were repeated until the complete extraction of targeted bio-actives had been achieved. The combined reflux pooled extracts were concentrated to reduce the volume. The residue was milled and sieved to get a powder extract. The physical parameters (identification, description, colour, odour, taste, and foreign matter), heavy metal and microbial analysis were performed for both extracts as per USP specifications [ 18 – 22 ]. After analysis, the powdered extract without any excipient was encapsulated in the GMP-Certified facility in a veggie capsule size “00” containing 300 mg Boswellia serrata and 250 mg celery seed extracts.", "score": 11}], "note": "hydroalcoholic reflux 명시. 에탄올/메탄올을 임의로 특정하지 않음", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "제조법 또는 용매의 일부/전부 미확정", "x": 1291.31096640592, "y": 667.3308088162335, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:51aa28c461e9d815", "kind": "paper", "name": "A double blind, randomized, placebo controlled study of the efficacy and safety of 5-Loxin for treatment of osteoarthritis of the knee.", "title": "A double blind, randomized, placebo controlled study of the efficacy and safety of 5-Loxin for treatment of osteoarthritis of the knee.", "doi": "10.1186/ar2461", "folder": "PMC2575633", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P6", "section": "Materials and methods / Study design", "text": "A total of 75 selected patients with symptoms of moderate to mild OA were recruited into the study. Each patient was randomly assigned to a treatment group using a randomization table generated using validated computer software (R 2/ptr.6338", "folder": "PMC6681146", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P15", "section": "MATERIALS AND METHODS / Selection of BSE dosage", "text": "In this study, BSE tablets, each tablet containing the BSE extract of 169.33 mg with a mean value of 87.3 mg of total β‐boswellic acids, corresponding to the four major β‐boswellic acids, namely, AKBBA (53.27 mg), BBA (20.83 mg), KBBA (7.11 mg), and ABBA (6.06 mg), were given twice a day. Thus, the selected dosage of BSE, equivalent to 87.3 mg of total β‐boswellic acids per tablet twice a day (174.6 mg of total β‐boswellic acids per day), was safe and was comparable or well below the amount of total β‐boswellic acids in BSE used in previous clinical trials in patients with OA or OA of the knee. The individual boswellic acids in the extract contents were AKBBA ≥ 30%, KBBA ≥ 1.5%, ABBA ≥ 3.5%, and BBA ≥ 7.5% with not less than 50% w/w of total boswellic acids in the extract.", "score": 6}], "note": "총 boswellic acids50% 이상으로 표준화한 제품; 제조용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1473.2860119672341, "y": 766.8824419737334, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:d47c04984234e9ed", "kind": "paper", "name": "An Anti-Inflammatory Composition of Boswellia serrata Resin Extracts Alleviates Pain and Protects Cartilage in Monoiodoacetate-Induced Osteoarthritis in Rats.", "title": "An Anti-Inflammatory Composition of Boswellia serrata Resin Extracts Alleviates Pain and Protects Cartilage in Monoiodoacetate-Induced Osteoarthritis in Rats.", "doi": "10.1155/2020/7381625", "folder": "PMC7261341", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P4", "section": "2. Materials and Methods / 2.1. Study Material", "text": "LI13019F1 (Serratrin®) is a composition of acidic and nonacidic fractions derived from an aqueous ethanol extract of B. serrata gum resin. To maintain the quality and batch-to-batch consistency, LI13019F1 was standardized to contain at least 30% of total BAs with not less than 5% Keto BAs. The major active boswellic acids present in LI13019F1 are 11-keto- β -boswellic acid (KBA; a), 3-O-acetyl-11-keto- β -boswellic acid (AKBA; b), α -boswellic acid ( α -BA; c), β -boswellic acid ( β -BA; d), 3-O-acetyl- α -boswellic acid ( α -ABA; e), and 3-O-acetyl- β -boswellic acid ( β -ABA; f) as depicted in Figure 1 . In the standardization process, the concentrations of these six compounds in LI13019F1 were analyzed using pure phytochemical reference markers on high-performance liquid chromatography (HPLC) system supported with Empower™ 3 software (Waters Corporation, Milford, MA). The phytochemical markers were purchased from Sigma Chemical Co. (St. Louis, MO). The chromatographic separation was performed using Kinetex C18 2.6 μ m (100 × 4.6 mm) column (Phenomenex, Torrance, CA) and a gradient elution system consisting of solvent A (0.1% v / v orthophosphoric acid in water) and solvent B (acetonitrile and methanol at 45 : 55 v / v . The detailed analytical method and a typical HPLC chromatogram along with the plant raw material collection, extraction process, and the manufacturing process of LI13019F1 have been described earlier [ 26 ].", "score": 11}], "note": "함수에탄올 추출물 유래 산성·비산성 분획 조성", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1253.100129018319, "y": 714.8243823618627, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:2d90db0fd6fc5474", "kind": "paper", "name": "Efficacy and tolerability of Boswellia serrata extract in treatment of osteoarthritis of knee", "title": "Efficacy and tolerability of Boswellia serrata extract in treatment of osteoarthritis of knee", "doi": "10.1078/094471103321648593", "folder": "PMID_12622457", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P17", "section": "Methods", "text": "Thirty patients were randomly allocated (randomization done by SAS system for Windows) in two groups of 15 each, to receive either active drug BSE of Salki Guggulu (Cap Wokvel�, manufactured by Pharmanza India) containing 333 mg of BSE per capsule, or placebo containing starch powder (supplied by Pharmanza India) in matching blister packing, colour, shape and size of the capsules in the dose of one capsule three times a day for eight weeks. Those who received BSE in first intervention were later crossed over to receive placebo in the second intervention and vice-versa. Each capsule of Wokvel� contained the standardized extract of Boswellia serrata gum having minimum 65% organic acids or minimum 40% total Boswellic Acids (BA). Main components of BA in BSE used were 11-keto-beta BA - 6.44%, 3-O-Acetyl-11-ketobeta BA - 2%, beta-BA - 18.51%, 3-O-Acetyl-beta BA- 8.58%, alpha BA- 6.93% and 3-O-Acetyl-alpha BA - 1.853%. Content analysis was done by HPLCUV detector. Primary standards were used from ChromaDex. All other chemicals were purchased from Merck in the highest available analytical grade. Since the active drug and placebo were dispensed in capsule formulation, masking the smell of active drug BSE, was not done. The clinical orthopedic investigator and the patients were blind for the interventions.", "score": 6}], "note": "최소40% boswellic acids 표준화 추출물", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufactu
