97", "base_color": "#718797"}, {"id": "paper:a8deafef61647427", "kind": "paper", "name": "Anti-inflammatory effects of Zanthoxylum schinifolium essential oil through iNOS, COX-2 and cytokines", "title": "Anti-inflammatory effects of Zanthoxylum schinifolium essential oil through iNOS, COX-2 and cytokines", "doi": "10.1002/jsfa.3653", "folder": "DOI_10.1002_jsfa.3653", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum schinifolium"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Anti-inflammatory effects of Zanthoxylum schinifolium essential oil through iNOS, COX-2 and cytokines", "matches": {"정유·휘발성 오일": "essential oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 959.5274247520231, "y": 280.65189177345337, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:b95a62e565ff639c", "kind": "paper", "name": "Effects of extracts of Zanthoxylum fruit and their constituents on spontaneous beating rate of myocardial cell sheets in culture", "title": "Effects of extracts of Zanthoxylum fruit and their constituents on spontaneous beating rate of myocardial cell sheets in culture", "doi": "10.1002/ptr.2650070111", "folder": "DOI_10.1002_ptr.2650070111", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "메탄올·함수메탄올 추출물"], "evidence": [{"location": "abstract", "section": "", "text": "AbstractIn the course of our studies on naturally occurring cardioactive agents, we investigated the effects of water and methanol extracts of a Chinese crude drug “Huajiao” the dried fruit of Zanthoxylum bungeanum, on the spontaneous beating rate (BR) of embryonic mouse myocardial cell sheets in culture. Both extracts significantly increased the BR. Through bioassay directed fractionation of the extracts, hydroxy‐β‐sanshool (1b), xanthoxylin (2) and two quercetin glycosides, hyperin (4) and quercitrin (6), were found to increase the BR in a standard medium (2.1 mM Ca2+). In a low Ca2+ medium (0.5 mM Ca2+), these compounds suppressed the decrease of BR, which was induced by low Ca2+. Of 16 flavonoids related in structure with hyperin (4) and quercitrin (6), quercetin, isoquercitrin, rutin, myricetin and myricitrin also increased the BR in the standard medium, while kaempferol and luteorin decreased the BR in the standard medium. When compared with control, hydroxy‐β‐sanshool (1b) and xanthoxylin (2) stimulated 13–15 fold calcium uptake of the cultured myocardial cells, which might have caused the positive chronotropic effect. Hyperin (4) and quercitrin (6) did not affect calcium uptake of the myocardial cells, Na+–K+ ATPase activity or Ca2+‐ATPase activity of sarcoplasmic reticulum."}], "note": "물 추출물과 메탄올 추출물을 비교", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 843.1107236804734, "y": 287.86133825070885, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:42a5d701ddf33b57", "kind": "paper", "name": "Antioxidant and nitrite-scavenging activities of Zanthoxylum bungeanum maxim. and Capsicum annuum L.: a synergistic, additive or antagonistic effect of the extr", "title": "Antioxidant and nitrite-scavenging activities of Zanthoxylum bungeanum maxim. and Capsicum annuum L.: a synergistic, additive or antagonistic effect of the extr", "doi": "10.1007/s00217-021-03845-4", "folder": "DOI_10.1007_s00217-021-03845-4", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P9", "section": "Extraction of ZBM and CAL and preparation of the mixtures", "text": "Whole Zanthoxylum bungeanum and chilli es": {"정유·휘발성 오일": "essential oil"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 964.3027245387358, "y": 236.33892396892878, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:d252ae67572fcf47", "kind": "paper", "name": "Antimicrobial activities of Lindera obtusiloba Blume and Zanthoxylum piperitum DC extracts", "title": "Antimicrobial activities of Lindera obtusiloba Blume and Zanthoxylum piperitum DC extracts", "doi": "10.11002/kjfp.2014.21.3.427", "folder": "DOI_10.11002_kjfp.2014.21.3.427", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "에탄올·함수에탄올 추출물"], "evidence": [{"location": "abstract", "section": "", "text": "Ethanol and hot water extracts were prepared from Lindera obtusiloba Blume (LO) and Zanthoxylum piperitum DC (ZP) and used to evaluate their antimicrobial activities and thermal stability against six foodborne pathogens (3 gram-positive and 3 gram-negative bacteria). The antimicrobial activities were assessed using the agar diffusion method, and the thermal stabilities of extracts were examined after heat treatment at 60, 70, 80, and 100℃ for 10 min. The zones of inhibition by the LO extract or the ZP extract of the tested microorganisms were in the range of 21-30 mm and 19-25 mm, respectively, at 100 mg/mL concentrations. The 60% ethanol extract and the hot water extracts from LO showed the strongest antimicrobial effects against MRSA and Staphylococcus aurues, respectively. For the extract from ZP, the strongest antimicrobial effect was shown against S. aurues by 60% ethanol, and the weakest antimicrobial effect was shown against E. coli by the hot water extracts. The ZP extracts showed that the gram-positive bacteria were more sensitive than gram-negative bacteria. For the thermal stability of the extracts, the antimicrobial effects stabilized after heat treatment. Overall, the data suggest that the extracts have a potential for application in various food products for which a natural antimicrobial additive is desired. Key words：Lindera obtusiloba Blume, Zanthoxylum piperitum DC, antimicrobial, foodborne pathogen, agar diffusion assay"}], "note": "에탄올과 열수 추출물 비교", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 875.1822768121547, "y": 323.4776820091716, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:de90f56d25491693", "kind": "paper", "name": "ANTIBACTERIAL EFFECTS OF NATURAL VOLATILE ESSENTIAL OIL FROM ZANTHOXYLUM PIPERITUM A .P. DC. AGAINST FOODBORNE PATHOGENS", "title": "ANTIBACTERIAL EFFECTS OF NATURAL VOLATILE ESSENTIAL OIL FROM ZANTHOXYLUM PIPERITUM A .P. DC. AGAINST FOODBORNE PATHOGENS", "doi": "10.1111/j.1745-4514.2011.00581.x", "folder": "DOI_10.1111_j.1745-4514.2011.00581.x", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "ANTIBACTERIAL EFFECTS OF NATURAL VOLATILE ESSENTIAL OIL FROM ZANTHOXYLUM PIPERITUM A .P. DC. AGAINST FOODBORNE PATHOGENS", "matches": {"정유·휘발성 오일": "ESSENTIAL OIL"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 871.6254118041802, "y": 207.2184681446709, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:7000778eeac1fdc9", "kind": "paper", "name": "Decontamination of green Sichuan pepper by combined irradiation and pulsed light", "title": "Decontamination of green Sichuan pepper by combined irradiation and pulsed light", "doi": "10.1111/jfs.70005", "folder": "DOI_10.1111_jfs.70005", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "abstract", "section": "", "text": "The results showed CIR could give rise to color change and volatile oil decrease of GSP, which indicated that the treatment time of CIR should be restricted in 5 min based on relevant Chinese national standard.", "matches": {"정유·휘발성 오일": "volatile oil"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 967.3148791034635, "y": 291.501039173269, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:f322974f97adb6e6", "kind": "paper", "name": "Inhibition of human liver microsomal CYP3A4 and CYP2D6 by extracts from 78 herbal medicines", "title": "Inhibition of human liver microsomal CYP3A4 and CYP2D6 by extracts from 78 herbal medicines", "doi": "10.11339/jtm.21.42", "folder": "DOI_10.11339_jtm.21.42", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["계피(생약명)", "Zanthoxylum(종 미명시)"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "title", "section": "", "text": "Inhibition of human liver microsomal CYP3A4 and CYP2D6 by extracts from 78 herbal medicines"}, {"location": "abstract", "section": "", "text": "78種の生薬エキスについて，ヒト薬物代謝酵素シトクロ ムP450 3A4(CYP3A4)およびP450 2D6(CYP2D6)に対 する阻害作用を調べた。生薬エキス粉末からメタノール可溶 性画分を調製し，添加量1.65mg/mLで反応を行った。 CYP3A4の指標として用いたヒト肝ミクロソーム中のエリ スロマイシンN-脱メチル化活性に対して50％以上の阻害を 示した生薬は31種であり，その中の8種（白芷，桂皮，丁 子，羌活，牡丹皮，大黄，蘇木，五味子）が阻害率90%以 上を示した。CYP3A4活性に対する阻害の強さは，蘇木， 大黄，五味子，羌活，白芷の順であり，IC50値は，それぞ れ 43，77，127，144 および185μg/mLであった。一方， CYP2D6の指標として用いたヒト肝ミクロソーム中のデキ ストロメトルファン〇-脱メチル化活性に対して50％以上の 阻害を示した生薬は28種であり，その中の13種（桂皮，丁 子，黄連，麻黄，釣藤鈎，羌活，厚朴，牡丹皮，黄柏，大黄， 蘇木，防巳，山椒）が阻害率90%以上を示した。CYP2D6 活性に対する阻害の強さは，黄柏，黄連，防巳，蘇木，大黄 の順であり，IC50値は各々4，14，40，52および64μg/mL であった。これらの結果から，CYP3A4あるいはCYP2D6 に対する阻害活性を示す生薬が複数存在することが明らかと なった。 *930-0194 富山市杉谷2630 富山医科薬科大学和漢薬研究所化学応用分野 手塚康弘 Kerry, N.L., Somogyi, A.A., Bochner, F. and Mikus, G.: The role of CYP2D6 in primary and secondary oxidative metabolism of dextromethorphan: in vitro studies using human liver microsomes. Br. J. Clin. Pharmacol., 38, 243-248, 1994. Guttendorf, R.J., Wedlund, P.J., Blake, J. and Chang, S.L.: Simplified phenotyping with dextromethorphan by thin-layer chromatography: application to clinical laboratory screening for deficiencies in oxidative drug metabolism. Ther. Drug. Monit., 10, 490-498, 1988. Baumann, P., Meyer, J.W., Amey, M., Baettig, D., Bryois, C., JonzierPerey, M., Koeb, L., Monney, C. and Woggon, B.: Dextromethorphan and mephenytoin phenotyping of patients treated with thioridazine or amitriptyline. Ther Drug. Monit., 14, 1-8, 1992. Kupfer, A., Schmid, B. and Pfaff, G.: Pharmacogenetics of dextromethorphan O-demethylation in man. Xenobiotica, 16, 421-433, 1986. Bourrie, M., Meunier, V., Berger, Y. and Fabre, G.: Cytochrome P450 isoform inhibitors as tool for the investigation of metabolic reactions catalyzed by human liver microsomes. J. Pharmacol. Exp. Ther., 277, 321-322, 1996. Broly, F., Libersa, C., Lhermitte, M., Bechtel, P. and Dupuis, B.: Effect of quinidine on the dextromethorphan O-demethylase activity of microsomal fractions from human liver. Br. J. Clin. Pharmac, 28, 29-36, 1989. Guo, L.Q., Taniguchi, M., Xiao, Y-Q., Baba, K., Ohta, T. and Yamazoe Y.: Inhibitory effect of natural furanocoumarins on human microsomal cytochrome P450 3A activity. Jpn. J. Pharmacol., 82, 122-129, 2000. Ishihara, K., Kushida, H., Yuzurihara, M., Wakui, Y., Yanagisawa, T., Kamei, H., Ohmori, S. and Kitada, M.: Interaction of drugs and Chinese herbs: Pharmacokinetic changes of tolbutamide and diazepam"}], "note": "수추출물에서 만든 메탄올 용해 분획을 시험. 전처리 수추출을 별도 유형으로 중복 집계하지 않음", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "D", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 828.8098798743006, "y": 284.24244878883377, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:be9963e4f1ef7e81", "kind": "paper", "name": "Pharmacokinetics and Toxicity Study of a Single Intravenous Dose of Distilled Extract of Zanthoxylum piperitum in ICR Mice", "title": "Pharmacokinetics and Toxicity Study of a Single Intravenous Dose of Distilled Extract of Zanthoxylum piperitum in ICR Mice", "doi": "10.1186/s44424-025-00024-0", "folder": "DOI_10.1186_s44424-025-00024-0", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "증류수상 추출물", "types": ["증류수상 추출물"], "evidence": [{"location": "body:P7", "section": "2.1 \u0007Chemicals and Reagents", "text": "The distilled extract of Zanthoxylum piperitum (deZP) was produced by mixing the plant material with 10 L of distilled water in an extractor, which was then boiled at 105 °C for 2 h. Approximately 5 L of the aqueous mixture was subsequently distilled at 107 °C to yield the final deZP extract. The completed deZP was stored at 4 °C. In our previous study [23], terpinen-4-ol was identified as a key constituent of deZP at a concentration of approximately 480 μg/ml using electron ionization mass spectrometry. In the present study, terpinen-4-ol (≥ 95% purity)", "score": 7}], "note": "열수 처리 후 107도 증류한 수상 시료. 정유와 동일시하지 않음", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 937.4578768634038, "y": 209.55675823297162, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:c0c09f50e9ef8668", "kind": "paper", "name": "Mechanism of Atropine-Resistant Contraction Induced by Dai-kenchu-to in Guinea Pig Ileum", "title": "Mechanism of Atropine-Resistant Contraction Induced by Dai-kenchu-to in Guinea Pig Ileum", "doi": "10.1254/jjp.86.32", "folder": "DOI_10.1254_jjp.86.32", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P12", "section": "Drugs", "text": "Hydroxy �-sanshool was isolated from the extract of Zanthoxylum fruit (Rutaceae, Zanthoxylum piperitumDE CANDOLLE, pericarpium) by the method described previously (10). Dai-kenchu-to extract powder {extracts in water from a 5:3:2 mixture of dried ginger root (Zingiberaceae, Zingiber officinale ROSCOE, rhizoma), ginseng (Araliaceae, Panax ginseng C.A. MEYER, radix) and Zanthoxylum fruit}, extract powder of Zanthoxylum fruit and malt sugar (the candy produced from rice, wheat and malt) were manufactured by Tsumura & Co. (Tokyo). Dai-kenchu-to was prepared by mixing Dai-kenchu-to extract powder and malt sugar at a ratio of 1:8. Dai-kenchu-to was used at a concentration identical to that of the powdered extracted of Daikenchu-to. The other drugs used were: acetylcholine chloride (ACh) (Ovisot Injection; Daiichi Pharmaceutical Co., Tokyo); tetrodotoxin (TTX) (Wako Pure Chemicals, Osaka); spantide (Novabiochem, Läufelfingen, Switzerland); and pyridoxal-phosphate-6-azophenyl-2',4'-disulphonic acid tetrasodium (PPADS) (Research Biochemicals International, Natick, MA, USA). Atropine sulfate, capsaicin and capsazepine were purchased from Sigma Chemical Co. (St. Louis, MO, USA).", "score": 7}], "note": "extracts in water로 제조된 대건중탕 분말", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 916.551917881238, "y": 327.8132835060237, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:a0d0b951a73b62bf", "kind": "paper", "name": "Antioxidant and Cytoprotective Activities of Flavonoid Glycosides-rich Extract from the Leaves of Zanthoxylum bungeanum", "title": "Antioxidant and Cytoprotective Activities of Flavonoid Glycosides-rich Extract from the Leaves of Zanthoxylum bungeanum", "doi": "10.12691/jfnr-2-7-4", "folder": "DOI_10.12691_jfnr-2-7-4", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P6", "section": "Antioxidant and Cytoprotective Activities of Flavonoid Glycosides-rich Extract from the Leaves of Zanthoxylum bungeanum", "text": "Abstract The Zanthoxylum bungeanum leaf has been traditionally taken as a vegetable and seasoning in China. To disclose the mechanisms of its benefit for human health, antioxidant activity and cytoprotective effect of the leaf were investigated. The ethyl acetate fraction exhibited the strongest ABTS and DPPH radicals scavenging activities as compared with chloroform and water fractions, as well as the crude extract. This fraction exhibited a protective effect against hydrogen peroxide-induced cytotoxicity in PC12 cells by MTT reduction assay. Furthermore, the cytoprotective effect was confirmed using flow cytometry analysis. Comparing with the model cells, the ethyl acetate fraction significantly increased G0/G1 and G2/M phase cells together with reducing S phase cells. Ten flavonoid glycosides were identified as isovitexin, vitexin, hyperoside, rutin, isoquercitrin, foeniculin, trifolin, quercitrin, astragalin, and afzelin from this fraction using high performance liquid chromatography-tandem mass spectrometry and nuclear magnetic resonance spectroscopy. This is the first report for the presence of vitexin, isovitexin, astragalin, trifolin and afzelin in Z. bungeanum. Hence, the results present here suggest the potential utility of Z. bungeanum leaf as a source of natural antioxidant due to its diversity and high content of flavonoids.", "score": 11}], "note": "ethyl acetate 분획 및 기타 분획의 활성 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획· g・mL -1 であった．この濃度においてプレー ト上の細胞は青く染色され，細胞が生存していることが示 されている．これは，検体添加培養液中に細胞障害がない ことを示している．細胞障害や細胞増殖抑制がある場合に は，細胞が染色されないか染色像が薄くなる．以上の結果 は，ブドウサンショウの乾燥果房に細胞障害のない濃度で， 抗SARS-CoV活性を持つ物質が存在することを示している．"}], "note": "열수·30% 에탄올 조추출 및 부분 정제 분획의 활성 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 823.7198928698027, "y": 238.16470145422554, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:1c8e003f81dd1320", "kind": "paper", "name": "Cytotoxicity Effects of Zanthoxylum simulans Hance. Fruit Bark Extract", "title": "Cytotoxicity Effects of Zanthoxylum simulans Hance. Fruit Bark Extract", "doi": "10.25073/2588-1132/vnumps.4501", "folder": "DOI_10.25073_2588-1132_vnumps.4501", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum simulans"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "abstract", "section": "", "text": "Samples of Zanthoxylum simulans were extracted with 70% ethanol and subsequently fractionated with n-Hexane, ethyl acetate (EtOAc), and n-butanol (n-BuOH) solvents.", "matches": {"에탄올·함수에탄올 추출물": "extracted with 70% ethanol", "분획·농축 성분군": "ethanol and subsequently fraction"}}], "note": "에탄올 추출 후 용매 분획. 대표 유형은 분획으로 배정", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 978.0104264199424, "y": 240.8544486019381, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:ad5dd2af5d88eab3", "kind": "paper", "name": "Essential oil from Zanthoxylum tingoassuiba loaded into multilamellar liposomes useful as antimicrobial agents", "title": "Essential oil from Zanthoxylum tingoassuiba loaded into multilamellar liposomes useful as antimicrobial agents", "doi": "10.3109/0 5 μg/mL, 에탄올 추출물은 98.46 μg/mL의 함량이 확인되었다.", "matches": {"물·열수 추출물": "열수 추출", "에탄올·함수에탄올 추출물": "에탄올 추출"}}, {"location": "body:P0", "section": "Efficacy Evaluation of Zanthoxylum Schnifolium Seed Coat Extract for Inner Beauty Materials", "text": "DPPH 라디 컬 소거능을 측정한 결과 500 μg/mL 농도에서 열수 추출물은 73.23%, 에탄올 추출물은 85.24%로 확인되었으며.", "matches": {"물·열수 추출물": "열수 추출", "에탄올·함수에탄올 추출물": "에탄올 추출"}}, {"location": "body:P0", "section": "Efficacy Evaluation of Zanthoxylum Schnifolium Seed Coat Extract for Inner Beauty Materials", "text": "ABTS 라디컬 소거능을 측정한 결과 열수 추출물은 80.61%, 에탄올 추 출물은 89.12%로 확인되어 비타민 C 보다는 낮지만 에탄올 추출물은 BHT보다는 높은 소거능이 확인되었다.", "matches": {"물·열수 추출물": "열수 추출", "에탄올·함수에탄올 추출물": "에탄올 추출"}}, {"location": "body:P0", "section": "Efficacy Evaluation of Zanthoxylum Schnifolium Seed Coat Extract for Inner Beauty Materials", "text": "Tyrosinase 저해효과를 측정한 결과 500 μg/mL 농도에서 열수 추출물은 48.51%, 에탄올 추출물은 62.12%의 저해효과가 확인 되어 비타민 C보다는 낮지만 농도 의존적으로 tyrosinase 저해효과가 확인되었다.", "matches": {"물·열수 추출물": "열수 추출", "에탄올·함수에탄올 추출물": "에탄올 추출"}}, {"location": "body:P0", "section": "Efficacy Evaluation of Zanthoxylum Schnifolium Seed Coat Extract for Inner Beauty Materials", "text": "Elastase 저해효과를 측정한 결과 열수 추출물 31.73%의 저해효과가 확인 되었고, 에탄올 추출물은 51.17%의 저해효과가 확인 되어, ursolic acid 보다는 낮지만 농도의존적으로 elastase 저해효과가 확인되었다.", "matches": {"물·열수 추출물": "열수 추출", "에탄올·함수에탄올 추출물": "에탄올 추출"}}, {"location": "body:P1", "section": "Efficacy Evaluation of Zanthoxylum Schnifolium Seed Coat Extract for Inner Beauty Materials", "text": "In this study, the quality of the Zanthoxylum schnifolium seed coat extract was evaluated by measuring the pH, sugar content, and color of the hot water extract for the inner beauty material.", "matches": {"물·열수 추출물": "hot water extract"}}, {"location": "body:P14", "section": "1) 산초 종피 추출물의 총 폴리페놀 및 플라보노이드 함량 측정", "text": "산초 종피 열수, 에탄올 추출물의 총 페놀 함량은 측정은 Folin-Denis (1915)의 방법 에 따라 측정하였다.", "matches": {"에탄올·함수에탄올 추출물": "에탄올 추출"}}, {"location": "body:P14", "section": "1) 산초 종피 추출물의 총 폴리페놀 및 플라보 검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 966.9301118482988, "y": 208.49217326062535, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:06af9bd8eabc88a5", "kind": "paper", "name": "산초 종자로부터 추출된 산초 오일의 물리화학적 조성과 특성", "title": "산초 종자로부터 추출된 산초 오일의 물리화학적 조성과 특성", "doi": "", "folder": "FILE_3463fa455dfa", "fields": ["산초류"], "field": "산초류", "plant_labels": ["산초(학명 미명시)"], "category": "종자유·고정유", "types": [], "evidence": [{"location": "title", "section": "", "text": "산초 종자로부터 추출된 산초 오일의 물리화학적 조성과 특성"}, {"location": "abstract", "section": "", "text": "Background: The seed oil of Zanthoxylum schinifolium S. et Z. (sancho) is a traditional vegetable oil that is usually sold at high prices. However, there is no information on the characteristics of sancho oil according to the collection site in Korea. Therefore, this study investigated characteristics such as the fatty acid composition, acid value, peroxide value, color, consistency, volatile compound composition, and antioxidant activity of sancho oil from different sites. This is an open access article distributed under the terms of the Creative Commons Attribution Non-Commercial License (http:// creativecommons.org/licenses/ by-nc/3.0/) which permits unrestricted non-commercial use, distribution, and reproduction in any medium, provided the original work is properly cited. Methods and Results: Sancho seeds were collected from four sites (Hadong, Gapyeong, Jinan, and Yeongwol), that produce sancho oil, which was extracted by pressing. The content of major fatty acids, acid value, peroxidation degree, color and antioxidant activity were significantly different between the by collection sites. However, there was no significant difference in viscosity. Conclusions: The fatty acid content of sancho oil varied according to the collection site, and properties such as acid value and antioxidant activity were different. Therefore, it is necessary to standardize the production and distribution of sancho oil produced in Korea, and studies to identify high-yielding varieties are important. Key Words: Zanthoxylum schinifolium, Acid Value, Antioxidant, Collection Site, Fatty Acid, Sancho Oil"}], "note": "제목에 산초 종자에서 추출한 오일 명시", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 895.5350393506087, "y": 345.44272629572174, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:50c22d124b81798d", "kind": "paper", "name": "Antioxidative and Anti-aging Effects of Sancho (Zanthoxylum schinifolium) Leaf Extracts", "title": "Antioxidative and Anti-aging Effects of Sancho (Zanthoxylum schinifolium) Leaf Extracts", "doi": "", "folder": "FILE_499e183fbfa3", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum schinifolium"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P2", "section": "Antioxidative and Anti-aging Effects of Sancho (Zanthoxylum schinifolium) Extract in Rats Fed High Fat Diet", "text": "hmt e s o S- t a d sas s sn schinifoliumn) leaves. Two extracts were obtained by 80% methanol extraction followed by subsequent fractionation with methylene chloride (MC) and n-butanol (B) and fed at one or three levels to rats on normal level (5%) of fat (control) and high fat (20%) in diets. Male Sprague-Dawley rats weighing about 100 g were divided into ten groups such as control diet group (C), control diet+0.50%B group (CB), control diet+0.50%MC group (CMC), high-fat diet group (HF), high-fat diet+0.25%B group (HBL), high-fat diet+0.50%B group (HBM), high-fat diet+ 0.75%B group (HBH), high-fat diet+0.25%MC group (HMCL), high-fat diet+0.50%MC group (HMCM) and high-fat diet+0.75%MC group (HMCH) and fed each diet for four weeks. The effects of the extracts on antioxidant enzyme activities and indices of lipid peroxidation and aging were seen only in high fat diet groups. Hepatic superoxide dismutase and aryleaterase activities were not changed by Sancho extracts. But glutathione peroxidase, catalase and paraxonase activities were significantly restored by both MC and B at the level of 0.75% Lipid peroxide which was increased by high fat diet was significantly reduced by B and MC at the level of 0.25% and over. Lipofuscin fluorescence and cabonyl value were increased by high fat diet were reduced byB and MC at the level of 0.5% and over. It is concluded that the Sancho extracts can be utilized as functional ingredients of health foods for reducing oxidative stress."}, {"location": "body:P15", "section": "1. Preparation of Sancho Extracts", "text": "The powder of dry leaves were extracted with 80% methanol and concentrated by rotary vacuum evaporator to obtain methanol concentrate. This concentrate was dissolved in 1 L of water and extracted with 600 mL of CH2Cl2 three times and concentrated to obtain CH2Cl₂ fraction. Then the water layer was extracted again with 600 mL n-BuOH eight times and concentrated to obtain n-butanol fraction. (Fig. 1)"}], "note": "메탄올 추출 뒤 MC·부탄올 분획을 시험. 분획 수층을 물 추출물로 오인하지 않음", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 839.1048224098882, "y": 202.85495508519577, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:0317f9a0afec4a1a", "kind": "paper", "name": "Anti-inflammatory Activities of Chopi (Zanthoxylum piperitum A.P. DC.)", "title": "Anti-inflammatory Activities of Chopi (Zanthoxylum piperitum A.P. DC.)", "doi": "", "folder": "FILE_5602ae4e9799", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "body:P15", "section": "Materials and Methods", "text": "Extraction and separation of EO EO nd Methods / 4.2. Preparation of Extract of Andaliman Fruit", "text": "Fresh Andaliman fruit was washed thoroughly to remove soil and other impurities, then drained and weighed to obtain the wet weight. Next, the fruit was dried in a drying cupboard until dry. The dried simplicia was weighed and then blended into powder. Then, was placed in a plastic bag and stored at room temperature. The extract was made by maceration, namely Andaliman simplicia powder in a specific ratio, soaked in 60% ethanol. A total of 1.5 kg of simplicia powder with a suitable degree of fineness was placed into a vessel, poured with 11.25 liters of 60% ethanol, covered, and left for five days protected from light while being stirred repeatedly. After five days, it was filtered, and the dregs were squeezed. The dregs were washed with 60% ethanol, stirred, and mixed until 15 liters were obtained. The macerate was collected in a closed vessel, left in a cool place protected from light for two days, and then poured off. The extract was concentrated using a rotary evaporator and then dried using a freeze-dryer [ 55 , 56 ].", "score": 11}], "note": "60% 에탄올 5일 침출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 903.8243566805487, "y": 356.49187366568157, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:30a23cebad15acfe", "kind": "paper", "name": "Green synthesis of silver and iron nano composites using aqueous extract of zanthoxylum armatum seeds and their application for removal of acid black 234 dye.", "title": "Green synthesis of silver and iron nano composites using aqueous extract of zanthoxylum armatum seeds and their application for removal of acid black 234 dye.", "doi": "10.3389/ftox.2024.1288783", "folder": "PMC10982318", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum armatum"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "e Z. zanthoxyloides", "text": "Alkaloid extraction was performed as previously described 15 with slight modifications. Briefly, dry pulverized stem and root samples of Z. zanthoxyloides (520 g) were extracted through cold maceration with 70% EtOH (v/v; 2 L) for 72 h. The crude ethanol extract was filtered and concentrated with a rotary evaporator (Eyela Co. Ltd, Tokyo, Japan). The process was repeated three times for optimization of the resultant crude ethanol extract. The crude ethanol extract was adjusted to pH 10 by addition of 25% NH 4 OH (5 mL). To obtain SRAEZZ, we extracted the alkaloid component of the crude ethanol extract with chloroform (CHCl 3, v/v; 250 mL × 6) with a separating funnel. The CHCl 3 was evaporated to dryness to obtain SRAEZZ of mass 3.028 g. The entire extraction process was repeated several times to obtain a sufficient mass of SRAEZZ for all experiments. The alkaline aqueous layer was then acidified with concentrated HCl to pH 2. A saturated potassium iodide solution was prepared and added to the acidic solution. The iodide salts of quaternary alkaloidal bases were extracted with chloroform. The extraction with chloroform was repeated three times, each with 10 mL solvent. The combined chloroform extract containing the iodide salts of quaternary alkaloidal bases was concentrated to dryness, thus yielding 0.095 g. Hydrogen sulfide gas was bubbled through the mixture of iodide salts of quaternary alkaloidal bases to free the quaternary alkaloids. The mixture of crude alkaloids (0.052 g) was separated on an A12 03 column on a neutral and reanal activity grade II with chloroform as the eluting solvent, followed by other solvent systems; chloroform/methanol and methanol (10 mL fractions) served as eluents. This process was repeated several times with fresh crude alkaloid mixture from SRAEZZ. Two alkaloids were obtained from the combined fractions 56–92 (labeled QI) and fractions 98–134 (labeled Q2) after evaporation of the solvent and were purified by recrystallization from methanol. The masses obtained for Q1 and Q2 were 21 mg and 10 mg, respectively ( Figure 1 ). The isolated compound Q2 was found to contain impurities, whereas the isolated compound Q1 was relatively pure."}], "note": "조 에탄올 추출물에서 알칼로이드 성분을 클로로포름으로 분획한 시험 소재", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 915.1806656306954, "y": 173.14209681855553, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:a3f5074026a05876", "kind": "paper", "name": "Preparation of Complex Polysaccharide Gels with Zanthoxylum bungeanum Essential Oil and Their Application in Fish Preservation.", "title": "Preparation of Complex Polysaccharide Gels with Zanthoxylum bungeanum Essential Oil and Their Application in Fish Preservation.", "doi": "10.3390/gels10080533", "folder": "PMC11353599", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Preparation of Complex Polysaccharide Gels with Zanthoxylum bungeanum Essential Oil and Their Application in Fish Preservation.", "matches": {"정유·휘발성 오일": "Essential Oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 962.0051610137544, "y": 341.6967116937865, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:12d7ac3f2204ca90", "kind": "paper", "name": "HS-GC-IMS Analysis of Volatile Organic Compounds in Six Spicy Spices and Their Effects on Ulcerative Colitis.", "title": "HS-GC-IMS Analysis of Volatile Organic Compounds in Six Spicy Spices and Their Effects on Ulcerative Colitis.", "doi": "10.3390/molecules29163764", "folder": "PMC113 nd boiled in an oil bath at 100 °C for 10 min, 20 min, 30 min, and 40 min, respectively. The samples were cooled and filtered to obtain HW. HW preparation experiments were repeated 3 times, sealed and refrigerated at −18 °C for backup.", "score": 6}], "note": "화자오25g과 정제수200mL를100도에서 가열", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 854.0791935799332, "y": 179.21169185726308, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:49114ceee63046e0", "kind": "paper", "name": "An Evaluation of the Effects of Pepper ( Zanthoxylum bungeanum Maxim. ) Leaf Extract on the Physiochemical Properties and Water Distribution of Chinese Cured Meat (Larou) During Storage.", "title": "An Evaluation of the Effects of Pepper ( Zanthoxylum bungeanum Maxim. ) Leaf Extract on the Physiochemical Properties and Water Distribution of Chinese Cured Meat (Larou) During Storage.", "doi": "10.3390/foods13233972", "folder": "PMC11640926", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P3", "section": "2. Materials and Methods / 2.1. Materials", "text": "ZL extracts were obtained by ultrasonic-assisted ethanol extraction (SB-4200 DTD, Scientz, Ningbo, China) on the basis of our previous study [ 16 ].", "matches": {"에탄올·함수에탄올 추출물": "ethanol extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1002.3558168417538, "y": 302.007034781669, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:f421054880e74346", "kind": "paper", "name": "Biotechnological Phytocomplex of Zanthoxylum piperitum (L.) DC. Enhances Collagen Biosynthesis In Vitro and Improves Skin Elasticity In Vivo.", "title": "Biotechnological Phytocomplex of Zanthoxylum piperitum (L.) DC. Enhances Collagen Biosynthesis In Vitro and Improves Skin Elasticity In Vivo.", "doi": "10.3390/pharmaceutics17010138", "folder": "PMC11768096", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "배양·발효 유래 소재", "types": [], "evidence": [{"location": "abstract", "section": "", "text": "Background: Zanthoxylum piperitum (L.) DC., commonly known as Japanese pepper, is a deciduous shrub native to East Asia. Its berries are widely used as a spice, known for imparting a distinctive, tingly numbing sensation. Biologically, Z. piperitum has antimicrobial, antioxidant, and anti-inflammatory properties, and it is studied for its potential benefits in pain relief and digestive health. This study proposed a novel biotechnological Z. piperitum phytocomplex (ZPP) obtained by plant cell culture for skin health, specifically targeting collagen synthesis, extracellular matrix stability, and resilience against cellular stress. Given the bioactivity of Z. piperitum, we aimed to analyze its efficacy as a sustainable alternative for skin-supportive applications in cosmetics and supplements. Methods: ZPP was produced through stable plant cell cultures, yielding a lignan-rich (3.02% w/w) phytocomplex. Human fibroblasts (HFFs) were treated with varying ZPP concentrations to assess cellular viability, collagen metabolism, and ECM-related enzyme activities, both under normal and cell stress conditions. The in vivo assessment was performed by measuring biophysical skin parameters such as hydration, elasticity, and roughness in female volunteers for a period of six weeks. Results: In vitro, ZPP exhibited non-cytotoxicity at all concentrations tested. Under hyperosmotic stress, ZPP reduced cellular damage, suggesting enhanced resilience. ZPP upregulated lysyl oxidase (LOX) protein levels, critical for collagen cross-linking and ECM stability, with protective effects observed under oxidative/inflammatory conditions. Additionally, ZPP selectively inhibited collagenase, attenuating collagen breakdown, though antioxidant activity was modest. In vivo evaluation highlighted improved skin hydration, elasticity, and roughness. Conclusions: ZPP shows promise as a biotechnological agent for skin health, particularly in supporting collagen integrity, ECM stabilization, and cellular resilience under stress. While further studies are needed to explore its full efficacy, especially for aging and environmentally stressed skin, these findings highlight ZPP’s potential as a new ingredient for cosmetic formulations aimed at skin care and the treatment of alterations caused by aging or environmental conditions. Keywords: Zanthoxylum piperitum, lignans, phytocomplex, collagenase, lysyl oxidase, skin"}], "note": "식물세포 배양으로 얻은 lignan-rich phytocomplex", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 794.7900955167023, "y": 296.5795098350236, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:1844d466df34d87b", "kind": "paper", "name": "Biological Activity and Chemical Composition of Essential Oil from Leaves and Fruits of Zanthoxylum mantaro (J.F.Macbr.) J.F.Macbr.", "title": "Biological Activity and Chemical Composition of Essential Oil from Leaves and Fruits of Zanthoxylum mantaro (J.F.Macbr.) J.F.Macbr.", "doi": "10.3390/antibiotics14030216", "folder": "PMC11939371", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum mantaro"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Biological Activity and Chemical Composition of Essential Oil from Leaves and Fruits of Zanthoxylum mantaro (J.F.Macbr.) J.F.Macbr.", "matches": {"정유·휘발성 오일": "Essential Oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분 ial oil in Zanthoxylum armatum DC. leaves and application in flavor oil.", "matches": {"정유·휘발성 오일": "essential oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 785.6962047273893, "y": 263.9610609940408, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:3f15bc709e6ef413", "kind": "paper", "name": "Efficacy of topical analgesia Zanthoxylum rhetsa in the treatment of primary knee osteoarthritis: A randomized, double-blind, positive-controlled clinical trial.", "title": "Efficacy of topical analgesia Zanthoxylum rhetsa in the treatment of primary knee osteoarthritis: A randomized, double-blind, positive-controlled clinical trial.", "doi": "10.1016/j.jaim.2024.101108", "folder": "PMC12149429", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum rhetsa"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "abstract", "section": "", "text": "The essential oil from the pericarp (EOP) of Zanthoxylum rhetsa (Roxb.) DC. inhibits prostaglandin E2, which is related to knee osteoarthritis (OA). However, there is no clinical report on its efficacy. To assess the efficacy of EOP in Z. rhetsa (ZR) spray as a novel spray compared to diclofenac (DF) spray in elderly individuals diagnosed with primary knee OA. 60 patients with unilateral knee pain over three months were randomly assigned to either the ZR spray (experimental) or DF spray (control) group. Each group applied the spray topically 3 times daily (2 mL each time) for 14 consecutive days. Follow-ups occurred after day 7 and after day 14. Primary outcomes included pain score measurements, with secondary outcomes focusing on WOMAC index scores. The ZR and DF spray groups did not significantly differ at baseline. ZR spray is the first to demonstrate non-inferior efficacy compared to DF spray, with no significant difference in the mean change of pain scores at rest after 10 min (effect size \u003c0.2) and following a 20-m walk test (effect size \u003c0.5), including walking time (effect size \u003c0.2), as well as in WOMAC index scores (effect size \u003c0.3) from baseline to the first and second visits. Additionally, patients treated with ZR spray required less oral medication from the first visit. Analgesia and improved knee functionality provided by ZR spray are suitable for combined treatment in elderly patients with co-morbidities or limited oral NSAID medication due to increased risk. Keywords: Zanthoxylum, Osteoarthritis, Analgesia, Pain measurement, Volatile oils, Topical administration"}], "note": "과피 정유를 함유한 ZR 스프레이 임상시험", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 985.3606782984109, "y": 199.94536864137672, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:8531d76c24ed3322", "kind": "paper", "name": "Antitrypanosomal and Antileishmanial Activities of Tacca leontopetaloides Tubers and Zanthoxylum zanthoxyloides Stem Bark.", "title": "Antitrypanosomal and Antileishmanial Activities of Tacca leontopetaloides Tubers and Zanthoxylum zanthoxyloides Stem Bark.", "doi": "10.3390/molecules30112468", "folder": "PMC12156181", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum zanthoxyloides"], "category": "복수 추출물 유형", "types": ["기타 유기용매 추출물", "메탄올·함수메탄올 추출물"], "evidence": [{"location": "body:P23", "section": "3. Materials and Methods / 3.2. Extraction and Isolation of Constituents", "text": "The dried and ground tubers (6.9 kg) and peel (4.0 kg) of T. leontopetaloides and 1 kg stem bark of Z. zanthoxyloides were each macerated with hexane, ethyl acetate, and methanol (2500 mL, 48 h) successively. The filtrates were concentrated on a rotary evaporator at 40 °C and air-dried to obtain the hexane, ethyl acetate, and methanol extracts. These extracts were subjected to TLC on pre-coated silica gel plates and visualized using anisaldehyde-H 2 SO 4 reagent. The hexane and ethyl acetate extracts of T. leontopetaloides showed similar profiles on TLC, and were therefore combined. Thus, four extracts were obtained: Tacca tuber hexane and ethyl acetate (TTHE), Tacca tuber methanol (TTM), Tacca peel hexane ethyl acetate (TPHE), and Tacca peel methanol (TPM). The maceration of Z. zanthoxyloides stem bark yielded three extracts: Zanthoxylum stem bark hexane (ZSH), Zanthoxylum stem bark ethyl acetate (ZSE), and Zanthoxylum stem bark methanol (ZSM). The extracts were subjected to column chromatography over silica gel 60 (0.063–0.200 mm for CC, Merck, Darmstadt, Germany). Each extract was pre-adsorbed onto silica gel and concentrated, in vacuo, to a free-flowing powder, loaded onto a wet-packed silica gel (150 g) column, and eluted gradient-wise using ethyl acetate in hexane, in 200 mL stepwise increases of 5% until 100% ethyl acetate for hexane and ethyl acetate extracts, while methanol in ethyl acetate was used similarly, but with 1% stepwise increases in methanol up to 10% methanol. The fractions (20 mL each) and numbers of vials collected were as follows: TTM 164, TPM 169, ZSM 100, TTHE 168, TPHE 162, ZSH 120, ZSE 150. Fractions with similar constituents were combined based on their TLC profiles.", "score": 11}], "note": "헥산·ethyl acetate·메탄올 순차 추출하여 활성 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 888.723285771453, "y": 362.2648305379236, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:187ef096b18a1ee2", "kind": "paper", "name": "In vitro phytochemical, antioxidant activity and antimycobacterial potentials of selected medicinal plants commonly used for respiratory infections and related symptoms in the Limpopo Province, South Africa.", thoxylum bungeanum"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P8", "section": "2. Materials and Methods / 2.2. Sensory Evaluation of Hui Li Red Sichuan Peppers with a Trained Sensory Panel", "text": "To prepare the samples for taste, flavour and chemesthetic sensations evaluation, Hui Li red Sichuan peppers from each harvest time were deseeded and soaked in boiling water for 3 min at a seed-to-water ratio of 1:100 ( w / v ). The peppers were then removed, and the remaining Sichuan pepper water extracts were cooled to room temperature and used for sensory evaluation within 2 h. At the start of the formal evaluation, panellists were instructed to rinse their mouths with filtered drinking water. Then, 5 mL of each Sichuan pepper water extract (presented to panellist in randomised order) was delivered to the panellist. The panellists were instructed to taste the Sichuan pepper water extracts and record their perceived intensity of taste (sweetness, saltiness, umami, bitterness), flavour (citrus, lingering), and chemesthetic sensations (cooling, spiciness), on a scale from 0 (very weak) to 9 (very strong). A 30 min break was given between the samples. The panellists were provided with warm purified water and salt-free crackers for palate cleansing.", "score": 11}], "note": "끓는 물 3분 침출액을 실제 관능평가 시료로 사용", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1013.6629451422565, "y": 283.157026338214, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:91921837e4e7dcc3", "kind": "paper", "name": "The Potential of Zanthoxylum acanthopodium DC. as Immunomodulators: Formulation, Activity Testing, and Extract Profiling.", "title": "The Potential of Zanthoxylum acanthopodium DC. as Immunomodulators: Formulation, Activity Testing, and Extract Profiling.", "doi": "10.3390/ph18071001", "folder": "PMC12300626", 1794faaea90bb6", "kind": "paper", "name": "Correction: Xue et al. Preparation of Complex Polysaccharide Gels with Zanthoxylum bungeanum Essential Oil and Their Application in Fish Preservation. Gels 2024, 10 , 533.", "title": "Correction: Xue et al. Preparation of Complex Polysaccharide Gels with Zanthoxylum bungeanum Essential Oil and Their Application in Fish Preservation. Gels 2024, 10 , 533.", "doi": "10.3390/gels11120967", "folder": "PMC12732330", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Correction: Xue et al. Preparation of Complex Polysaccharide Gels with Zanthoxylum bungeanum Essential Oil and Their Application in Fish Preservation. Gels 2024, 10 , 533.", "matches": {"정유·휘발성 오일": "Essential Oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 813.8730631380598, "y": 336.30997717475, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:c32efaca756ea82a", "kind": "paper", "name": "Integrating Molecular Analysis and the Pharmacology Network to Discover the Antioxidative Effects of Zanthoxylum piperitum Fruits", "title": "Integrating Molecular Analysis and the Pharmacology Network to Discover the Antioxidative Effects of Zanthoxylum piperitum Fruits", "doi": "10.3390/plants15010148", "folder": "PMC12787408", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P2", "section": "2. Results / 2.1. Screening Antioxidative Effects of Z. piperitum Extracts", "text": "Extraction was performed using ethanol–water solvent systems with ethanol concentrations of 0%, 20%, 40%, 60%, 80%, and 100%, applied to three plant organs (fruits, pericarps, and seeds) collected from two regions [Sangdong-myeon, GPS coordinates: 35.30324, 127.4247, (산동면, SDM) and Gurye-eup, GPS coordinates: 35.19979, 127.4096 (구례읍, GRE)]. As a result, 36 distinct extracts were successfully obtained, encompassing Sangdong-myeon fruits (SDM_F), pericarps (SDM_P), and seeds (SDM_S), together with Gurye-eup fruits (GRE_F), pericarps (GRE_P), and seeds (GRE_S), each prepared using ethanol–water solvent systems at concentrations of 0%, 20%, 40%, 60%, 80%, and 100% ethanol, and subsequently recovered following solvent removal under reduced pressure. These extracts were evaluated for their antioxidative properties by assessing their DPPH and ABTS radical scavenging activities. ABTS is a water-soluble radical that displays a distinct green-blue color in its oxidized state (ABTS +• ). Upon treatment with Z. piperitum extracts, the ABTS solution color changed from green-blue to green or faded to colorless, depending on the concentration of the sample. Among the GRE samples, P extracted with 0–60% EtOH and F extracted with 40–80% EtOH demonstrated potent ABTS radical scavenging activity, with EC 50 values ranging from 76.8 to 91.8 μg/mL relative to the other GRE extracts. Nearly all seed extracts and the F100 extract exhibited weak ABTS radical scavenging effects under the experimental conditions. For the SDM samples, fruits extracted with 20–100% EtOH and P extracts displayed markedly stronger antioxidative effects (EC 50 values: 55.9–89.8 μg/mL) compared with the other SDM extracts. SDM seed extracts also showed limited ABTS radical scavenging activity under experimental conditions. In the DPPH assay, the original solution was characterized by a deep violet color due to the presence of DPPH • radicals. This color intensity decreased or turned colorless depending on the reaction between the DPPH • radicals and the applied samples. After exposure to Z. piperitum extracts, the color of the DPPH solution was diminished. Among the SDM extracts, the P extracts induced a pronounced reduction in the DPPH solution color, with EC 50 values in the range of 48.0–80.1 μg/mL, followed by a moderate effect in the fruit extracts (EC 50 values, 85.5 to 184.1 μg/mL). The seed extracts had limited activity against DPPH radical scavenging (EC 50 values: 242.1–1011.7 μg/mL). GRE extracts also mediated the reduction in the DPPH solution color due to scavenging of DPPH • radicals. Specifically, P extracts (EtOH: 0%, 20%, 40%, 60%) and F extracts (40% EtOH) exhibited robust DPPH radical scavenging activity, with EC 50 values from 62.6 to 93.3 μg/mL, compared to the other organ extracts.", "score": 11}], "note": "0%부터 100%까지 에탄올 수용액으로 별도 추출물 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 906.8559070781284, "y": 162.69501223724427, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:fd001be77a3b6fbc", "kind": "paper", "name": "Seasonal changes of volatile compounds and odor evaluation of Zanthoxylum bungeanum 'Hanyuan' fruit during the development.", "title": "Seasonal changes of volatile compounds and odor evaluation of Zanthoxylum bungeanum 'Hanyuan' fruit during the development.", "doi": "10.1186/s12870-025-07878-9", "folder": "PMC12797513", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "body:P10", "section": "Materials and methods / Measurement parameters / Extraction of volatile oil", "text": "25 g of Zanthoxylum bungeanum ‘Hanyuan’ pericarp powder was used for volatile oil, which was extracted by the steam distillation method for 2 h.", "matches": {"정유·휘발성 오일": "volatile oil"}}, {"location": "body:P17", "section": "Materials and methods / Comprehensive evaluation", "text": "The heat map of the relative content of volatile oil compounds at the different stages was obta : Underlying roles of polyphenols.", "title": "Enhancing garlic-clove shaped gel properties of mandarin fish ( Siniperca chuatsi ) myofibrillar protein with prickly ash extracts: Underlying roles of polyphenols.", "doi": "10.1016/j.fochx.2026.103542", "folder": "PMC12853064", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum(종 미명시)"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P6", "section": "Materials and methods / Extraction of prickly ash polyphenol under different ethanol concentrations", "text": "Preparation of PAEs was based on the protocol outlined by Sun et al. (2020) with proper modifications. Under 70 °C, the prickly ash was desiccated to a constant weight, then pulverized and passed through a 20-mesh sieve. Each 10 g portion of the dried powder was blended with 100 mL of ethanol at 0%, 20%, 60%, and 100% ( v /v) concentrations and underwent a 24-h extraction at room temperature, followed by ultrasonication for 30 min. After centrifugation at 5000 × g for 30 min, the supernatant fluid was gathered, and the solid residues underwent two additional extractions under identical conditions. No. 9 filter paper and a 0.45 μm organic membrane were used to filter the combined supernatants sequentially. After rotary evaporation at 50 °C, a freeze dryer was used to lyophilize the extracts. The extracts created with 0%, 20%, 60%, and 100% ethanol were designated as PAE0, PAE20, PAE60, and PAE100, respectively, and were stored at −40 °C for usage. The Folin-Ciocalteu method was carried out to quantify the polyphenol content in the extracts with GA as the standard ( Jing et al., 2021 ). The contents were presented as milligrams of gallic acid equivalent (GAE) per gram of dry weight of the PAEs.", "score": 11}], "note": "0·20·60·100% 에탄올 추출물 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1000.4791941012221 851091472, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:72ec93c884183717", "kind": "paper", "name": "Phenolic Copigment Enhanced Anthocyanin Stability and Color Intensity of Frozen Red Huajiao ( Zanthoxylum bungeanum Maxim.) Fruit.", "title": "Phenolic Copigment Enhanced Anthocyanin Stability and Color Intensity of Frozen Red Huajiao ( Zanthoxylum bungeanum Maxim.) Fruit.", "doi": "10.3390/foods15101719", "folder": "PMC13205320", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P5", "section": "2. Materials and Methods / 2.2. Composition Analysis of RHAs / 2.2.1. Preparation of RHA Samples", "text": "The dried pericarp of red Huajiao was dried, ground, and sieved through a 60-mesh screen to obtain a uniformly fine powder. Briefly, 3.0 g of the prepared powder was accurately weighed and homogenously mixed with 90 mL of 60% ( v / v ) ethanol. The resulting mixture was subjected to ultrasonic-assisted extraction using a KH-300DE ultrasonic cleaner (Hechuang Ultrasonic Instrument Co., Ltd., Kunshan, Jiangsu, China) under controlled conditions: 25 °C, 40 kHz frequency, 270 W power, and a duration of 40 min. After extraction, the mixture was centrifuged at 10,000 r/min for 20 min at 4 °C using a ST16R centrifuge (Thermo Fisher Scientific, Waltham, MA, USA). The supernatant was collected and concentrated using rotary evaporation for 40 min to obtain crude RHA extract. For further purification, 20 mL of the crude extract was loaded onto a D-101 macroporous resin column (Φ1.6 cm × 70 cm). After 12 h of static adsorption, the column was eluted with 60% ( v / v ) ethanol at a constant flow rate of 1 mL/min. The eluted fractions were combined and concentrated using vacuum rotary evaporation at 40 °C for 40 min to remove residual ethanol. Finally, the purified solution was freeze-dried for 48 h using a Scientz-12N freeze dryer (Ningbo Scientz Biotechnology Co., Ltd., Ningbo, Zhejiang, China) to obtain RHA powder for subsequent experiments. The total anthocyanin content was quantified using the pH gradient method, and the anthocyanin purity was calculated using Equation (1).", "score": 11}], "note": "60% ethanol 추출 후 D-101 수지로 정제한 안토시아닌군", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 831.6400913785155, "y": 353.27860114061923, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:2fc7f55ecff26fbe", "kind": "paper", "name": "Pepper Constituents Enhance the Toxicity and Neurophysiological Effects of Natural Pyrethrins in Insects.", "title": "Pepper Constituents Enhance the Toxicity and Neurophysiological Effects of Natural Pyrethrins in Insects.", "doi": "10.3390/insects17050510", "folder": "PMC13207443", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["Piper", "Zanthoxylum(종 미명시)", "후추(일반명)"], "category": "기타 유기용매 추출물", "types": ["기타 유기용매 추출물"], "evidence": [{"location": "body:P3", "section": "2. Materials and Methods / 2.1. Chemicals", "text": "Black pepper ( Piper nigrum ) and Sichuan pepper ( Zanthoxylum spp.) were sourced from Tones (Ankeny, IA, USA) and Natural Green Plus (Queens, NY, USA), respectively. Extracts were obtained via agitation of 10 g of each raw pepper sample in a simple extraction solution of 1:1 solution of ethyl acetate:methanol for 15 min. Raw material was filtered using Whatman filter No. 2. Solvent was allowed to evaporate slowly in a chemical fume hood, and raw sample was then collected and maintained in the refrigerator. Piperonyl butoxide, a semi-synthetic analog of safrole found in sesame oil [ 22 ], was purchased from Sigma-Aldrich (St. Louis, MO, USA). The sample of natural pyrethrins (NPs) was from Fairfield American Corporation, (Frenchtown, NJ, USA). For comparison with the in vitro studies, NP molecular weight was estimated using the average molecular weight of all six pyrethrin components and their proportion within the sample (52%). Piperine from black pepper and α-hydroxysanshool (α-HS) from Sichuan pepper, having purities of 98% and >95%, were obtained from Sigma Aldrich (St. Louis, MO, USA) and Chengdu Alfa Biotechnology Co., Ltd. (Chengdu, China), respectively. All compounds were dissolved in 100% ethanol (from Sigma Aldrich) as a vehicle for topical application to adult mosquitoes. Inorganic salts and HEPES buffer for physiological salines were obtained from Fisher Scientific (Hampton, NH, USA).", "score": 11}], "note": "ethyl acetate:methanol 1:1 혼합용매로 한 추출물 제조. 두 유형으로 중복하지 않음", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 880.2027203237283, "y": 160.3959840779661, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:b7a4223c2a5f4ab1", "kind": "paper", "name": "Biodegradable chitosan-gelatin films incorporating Zanthoxylum limonella (Dennst.) Alston essential oil for antibacterial and hemostatic applications.", "title": "Biodegradable chitosan-gelatin films incorporating Zanthoxylum limonella (Dennst.) Alston essential oil for antibacterial and hemostatic applications.", "doi": "10.1038/s41598-026-47685-2", "folder": "PMC13230761", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum limonella"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Biodegradable chitosan-gelatin films incorporating Zanthoxylum limonella (Dennst.) Alston essential oil for antibacterial and hemostatic applications.", "matches": {"정유·휘발성 오일": "essential oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 997.968559244079, "y": 330.9279487367842, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:a34f2ec720ab4a3c", "kind": "paper", "name": "Valorization of Zanthoxylum bungeanum Maxim. Leaf By-Products: Comparative Aroma Profiling with Pericarps Across Extraction Strategies", "title": "Valorization of Zanthoxylum bungeanum Maxim. Leaf By-Products: Comparative Aroma Profiling with Pericarps Across Extraction Strategies", "doi": "10.3390/foods15122243", "folder": "PMC13298970", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum bungeanum"], "category": "복수 추출물 유형", "types": ["기타 유기용매 추출물", "정유·휘발성 오일"], "evidence": [{"location": "body:P5", "section": "2. Materials and Methods / 2.2. Preparation of Volatile Fractions", "text": "The pericarps and leaves of Z. bungeanum were obtained from Hubei Mingchuang Agricultural Technology Development Co., Ltd. (Huanggang, China). To ensure extraction efficiency, fresh leaves and dried pericarps (60 °C) were used immediately or stored at −20 °C. Following the aforementioned extraction methods [ 6 ], four types of volatile samples were prepared: solvent-extracted pericarp VEs (S1), steam-distilled pericarp EOs (S2), steam-distilled leaf EOs (S3), and solvent-extracted leaf VEs (S4). For the preparation of VEs (S1 and S4), 15 g of fresh leaves or dried pericarps were submerged in petroleum ether (105 mL for leaves; 180 mL for pericarps) within a 500 mL flask. The mixture underwent ultrasonic-assisted extraction for 30 min, followed by refluxing in a water bath at 40 °C for 2 h (timed from the onset of boiling). The resulting solution was filtered, and the filtrate was dehydrated with 5 g of anhydrous sodium sulfate at −20 °C overnight. After a secondary filtration, the solvent was removed via rotary evaporation under reduced pressure at 40 °C to yield the corresponding VEs (S1 and S4). For steam distillation (S2 and S3), 150 g of fresh leaves or 15 g of pericarps were placed in a specialized steam bulb. Distilled water (900 mL for leaves; 210 mL for pericarps) in the boiling flask was heated to generate continuous steam, which passed through the leaf matrix for 8 h. The EOs (S2 and S3) were subsequently recovered from the oil-water separator.", "score": 11}], "note": "석유에테르 추출물과 수증기증류 정유 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 775.0608106823815, "y": 272.65592341679024, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:17a1ee5c2dfb8fc7", "kind": "paper", "name": "Neuroprotective Effects of Distilled Extract of Zanthoxylum piperitum in Parkinson's Disease Models.", "title": "Neuroprotective Effects of Distilled Extract of Zanthoxylum piperitum in Parkinson's Disease Models.", "doi": "10.3390/nu18142350", "folder": "PMC13415035", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum piperitum"], "category": "증류수상 추출물", "types": ["증류수상 추출물"], "evidence": [{"location": "body:P5", "section": "2. Materials and Methods / 2.1. Materials", "text": "The deZP was purchased from AJ Pharmacopuncture (Seoul, Republic of Korea). According to the previously reported preparation method, deZP was produced by mixing the plant material with distilled water, followed by boiling, distillation, and storage at 4 °C until use [ 17 ]. 1-methyl-4-phenyl-1,2,3,6-tetrahydropyridine (MPTP) and 1-methyl-4-phenyl-1,2,3,6-tetrahydropyridine (MPP + ) were purchased from Sigma-Aldrich (St. Louis, MO, USA). Levodopa was purchased from Merck (PHR1271; Supelco, Merck, Bellefonte, PA, USA), and an anti-tyrosine hydroxylase (TH) antibody (AB152; Merck Millipore, Burlington, MA, USA) was utilized for immunohistochemistry (IHC) and immunofluorescence (IF). All chemicals utilized in this study were of analytical or high-grade quality.", "score": 6}], "note": "물로 끓인 뒤 증류하여 수상 추출물 제조", "review ii a spice from Cameroon induce mitochondrial dependent apoptosis...", "title": "Fruits and barks extracts of Zanthozyllum heitzii a spice from Cameroon induce mitochondrial dependent apoptosis...", "doi": "10.1186/0717-6287-47-54", "folder": "PMC4335363", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum heitzii"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "메탄올·함수메탄올 추출물"], "evidence": [{"location": "body:P15", "section": "Methods / Plant material and extraction", "text": "Fruits and barks of Zanthoxyllum heitzii (Rutaceae) were collected on the 30 th June 2010 at Batchingou in the west of Cameroon and identified under the reference number 1441/HNC of the National Herbarium of Cameroon where the voucher specimen is deposited there. Air-dried fruits and barks of Z. heitzii were ground and an aliquot (150 g) of each powder was extracted separately by maceration (72 h) in 1.5 L of water and methanol. The same procedure was repeated once with the same residues. Each mixture was filtered and concentrated to dryness. Each crude extract was stored at 4°C and freeze - dried for further studies.", "score": 11}], "note": "물과 메탄올로 개별 침출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 925.8937235657954, "y": 373.1142586994487, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:5c999743f3569e4b", "kind": "paper", "name": "The anti-inflammatory and antioxidant activity of 25 plant species used traditionally to treat pain in southern African.", "title": "The anti-inflammatory and antioxidant activity of 25 plant species used traditionally to treat pain in southern African.", "doi": "10.1186/s12906-015-0669-5", "folder": "PMC4443658", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["Peltophorum", "Zanthoxylum capense", "Clausena"], "category": "기타 유기용매 추출물", "types": ["기타 유기용매 추출물"], "evidence": [{  tests, namely, gelatin, vanillin and ferric chloride tests were performed as mentioned by Ali.[ 31 ] To detect saponins, froth, emulsion and lead acetate tests were applied.[ 32 ] To detect the presence of steroids, acetic anhydride was used with sulfuric acid in the first test and acetic chloride with sulfuric acid were used in another.[ 30 ] Sample extracted with chloroform was treated with sulfuric acid to test for the presence of terpenoids.[ 30 ] Ammonia solution and ferric chloride solutions were used for anthraquionones testing as mentioned by Brain and Turner.[ 29 ]", "matches": {"기타 유기용매 추출물": "extracted with chloroform"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1029.5594333233903, "y": 252.46956955970467, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:28469ed7a67e56e9", "kind": "paper", "name": "Essential Oils from Ugandan Aromatic Medicinal Plants: Chemical Composition and Growth Inhibitory Effects on Oral Pathogens.", "title": "Essential Oils from Ugandan Aromatic Medicinal Plants: Chemical Composition and Growth Inhibitory Effects on Oral Pathogens.", "doi": "10.1155/2015/230832", "folder": "PMC4478384", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["Ocimum", "Vernonia", "Cymbopogon", "Lantana", "Bidens", "Helichrysum", "Hoslundia", "Teclea", "Zanthoxylum chalybeum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Essential Oils from Ugandan Aromatic Medicinal Plants: Chemical Composition and Growth Inhibitory Effects on Oral Pathogens.", "matches": {"정유·휘발성 오일": "Essential Oils"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 814.230771 mples. While a significant decrease in the level of glutathione was observed in the positive control 2.63 ± 0.26 µ M, as compared to the negative control 0.36 ± 0.16 µ M, an increase in the concentration was noted in the treated groups. In the brain, the ethanol/water extract from the leaves (FEH: 2.35 ± 0.05 µ M) showed the more elevated activity compared to the other samples ( Figure 2(a) ) while, in the heart, the methanol extract from the leaves (FMH: 3.19 ± 0.07 µ M) had the highest concentration ( Figure 2(b) ). These two samples had shown the higher activities of the tested extracts. Our results also showed a significant variation of the level of glutathione from one organ to another (Figures 2(c) and 2(d) ).", "score": 7}], "note": "ethanol/water 및 methanol 잎 추출물 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 981.3016862536906, "y": 359.0596648994182, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:bcef0d4906f8b31a", "kind": "paper", "name": "Chemical Composition and In Vitro Cytotoxic and Antimicrobial Activities of the Essential Oil from Leaves of Zanthoxylum monogynum St. Hill (Rutaceae).", "title": "Chemical Composition and In Vitro Cytotoxic and Antimicrobial Activities of the Essential Oil from Leaves of Zanthoxylum monogynum St. Hill (Rutaceae).", "doi": "10.3390/medicines4020031", "folder": "PMC5590067", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum monogynum"], "category": "정유·휘발성 오일", "types": ["정유·휘발성 오일"], "evidence": [{"location": "title", "section": "", "text": "Chemical Composition and In Vitro Cytotoxic and Antimicrobial Activities of the Essential Oil from Leaves of Zanthoxylum monogynum St. Hill (Rutaceae).", "matches": {"정유·휘발성 오일": "Essential Oil"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 765.0265791214686, "y": 242.27769398742677, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:d9a4b6351bd8ade5", "kind": "paper", "name": "A Standardized Composition Comprised of Extracts from Rosmarinus officinalis , Annona squamosa and Zanthoxylum clava-herculis for Cellulite.", "title": "A Standardized Composition Comprised of Extracts from Rosmarinus officinalis , Annona squamosa and Zanthoxylum clava-herculis for Cellulite.", "doi": "10.4103/pr.pr_70_17", "folder": "PMC5717783", "fields": ["기타 식물", "산초류"], "field": "기타 식물 · 산초류", "plant_labels": ["Rosmarinus", "Zanthoxylum clava-herculis"], "category": "복수 추출물 유형", "types": ["초임계 추출물", "에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P7", "section": "MATERIALS AND METHODS / Materials / Annona squamosa L", "text": "The sugar apple fruit extract is manufactured through a series of proprietary processing steps which have been validated and performed in accordance with Good Manufacturing Practice (GMP). Annona dried whole fruit was ground to a particle size of no larger than 2 ml. Dried ground sugar apple fruit (100 kg) was then transferred to a supercritical fluid extractor (pressure 25 Mpa, temperature 50°C, CO 2 flow 70 ml/min, 2 h) and ethyl alcohol (95% food grade ethanol, quantity is 30% of the raw material) was added. The supercritical fluid CO 2 extract was evaporated under vacuum. The extraction yield is 3.7%. The contents of two biomarkers were quantified by high-performance liquid chromatography (HPLC) method with Squamocin not \u003c1%, and Kaurenoic acid content not \u003c4% in the extract. Squamocin and Kaurenoic Acid in the A. squamosa fruit extract were quantified with a Luna C-18 reversed-phase column (Phenomenex, 10 μm, 250 mm × 4.6 mm) in an Agilent HPLC system at 210 nm.", "score": 11}, {"location": "body:P8", "section": "MATERIALS AND METHODS / Materials / Zanthoxylum clava-herculis", "text": "A total of 800 kg of fresh Z. clava-herculis L. (Prickly Ash) tree bark was dried, cut, crushed, and then extracted with approximately 3-fold volume (2400 L) of 90% ethyl alcohol in water (v/v); the extraction was carried on at 90°C for 8 h. The ethanol solution was filtered to obtain the supernatant which was then concentrated with an evaporator under vacuum at 40°C. This extraction and concentration procedure was repeated three times. The extraction solutions were then combined and concentrated together. The concentrated solution stayed for 24 h in the refrigerator to obtain a supernatant. The supernatant was vacuum-dried to obtain 87.5 kg of Prickly Ash EtOH extract powder. The extraction yield was about 10.9% (w/w). Two biomarkers-Magnoflorine and Laurifoline in Prickly Ash extract were quantified with a Luna C18 reversed-phase column (Phenomenex, 5 μm, 250 mm × 4.6 mm) in an Agilent 1200 HPLC system at 275 nm.", "score": 11}], "note": "Annona 초임계CO2 추출 및 Zanthoxylum90% ethanol 추출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1017.8219114011569, "y": 204.13378734024906, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:41d7f20683542549", "kind": "paper", "name": "Evaluation of the antidiabetic property of aqueous leaves extract of Zanthoxylum armatum DC. using in vivo and in vitro approaches.", "title": "Evaluation of the antidiabetic property of aqueous leaves extract of Zanthoxylum armatum DC. using in vivo and in vitro approaches.", "doi": "10.1016/j.jtcme.2017.04.007", "folder": "PMC5755985", "fields": ["산초류"], "field": "산초류", "plant_labels": ["Zanthoxylum armatum"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "abstract", "section": "Abstract", "text": "The present study was designed to evaluate the antidiabetic potential of the aqueous leaves extract of Zanthoxylum armatum DC. leaves using in vivo and in vitro approaches. For in vivo studies, blood glucose level was monitored at different intervals after administration of varying doses of the extract for its hypoglycemic (100–6000 mg/kg b.w.) and antihyperglycemic (250 mg/kg b.w.) effect in normoglycemic and diabetic mice. In vitro enzymatic inhibition activity was tested against α-amylase, α- and β-glucosidase and lipase. Additionally hydroxyl radical, hydrogen peroxide scavenging assay and phytochemical screening were also performed. Element analysis of the plant was studied by Atomic Absorption Spectrometry (AAS) and Inductively Coupled Plasma Atomic Emission Spectrometer (ICP-AES). The plant extract showed significant hypoglycemic and antihyperglycemic effect in normoglycemic and diabetic mice. The IC50 values of extract for α-amylase, β-glucosidase, lipase, hydroxyl radical scavenging activity, hydrogen peroxide scavenging activity were 7.40 mg/ml, 0.30 mg/ml, 8.35 mg/ml, 3.25 mg/ml, 9.62 mg/ml respectively and the percentage of inhibition for α-glucosidase was 79.82% at 0.8 mg/ml. In vitro studies were compared with their respective standards. Elemental analysis revealed the presence of essential elements such as Mg, V, Fe, Cr, Zn, Cu, Mo, Mn, K, Ca, P and Sr which are all known to play a role in regulating blood glucose. The results demonstrate that Z. armatum aqueous leaves extract possess antidiabetic property in both in vivo and in vitro condition.", "score": 9}], "note": "aqueous leaves extract 명시", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 861.413739558126, "y": 377.75847896366736, "anchor": [900.0, 265.0], "radius": 2.6, "color": "#33567f", "base_color": "#4F86C6"}, {"id": "paper:c1d3b14afb4ccd37", "kind": "paper", "name": "Zanthoxylum ailanthoides Suppresses Oleic Acid-Induced Lipid Accumulation through an Activation of LKB1/AMPK Pathway in HepG2 Cells.", "title": "Zanthoxylum ail
