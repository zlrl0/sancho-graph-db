ammatory Boswellia composition was investigated in this study.", "score": 6}], "note": "20% AKBA 표준화 oleo-gum-resin 추출물", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1520.8598420272915, "y": 715.3026376476646, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:7f28ad888430e040", "kind": "paper", "name": "A Standardized Boswellia serrata Extract Improves Knee Joint Function and Cartilage Morphology in Human Volunteers with Mild to Moderate Osteoarthritis in a Randomized Placebo-Controlled Study.", "title": "A Standardized Boswellia serrata Extract Improves Knee Joint Function and Cartilage Morphology in Human Volunteers with Mild to Moderate Osteoarthritis in a Randomized Placebo-Controlled Study.", "doi": "10.1080/27697061.2024.2438894", "folder": "PMID_39700461", "fields": ["보스웰리아류"], "field": "보스웰리아류", "plant_labels": ["Boswellia·보스웰리아"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P16", "section": "2.1. Study material", "text": "SN13108F (commercially known as Aflapin® or AprèsFlex®) is a patented (13) synergistic composition of AKBA-enriched B. serrata oleo-gum-resin extract and a nonvolatile oil fraction of gum resin. Toxicological evaluations in the Organization for Economic Cooperation and Development (OECD)-recommended animal models and earlier clinical studies affirmed the comprehensive safety of SN13108F (12,14,16,19). The final product is a light brown to dark brown free-flowing dry powder, particle size 425 µm, with a bulk density of 0.25-0.35 g/cc, and standardized to contain at least 20% AKBA, as confirmed by HPLC. The method of preparation of SN13108F was described elsewhere (13). SN13108F is produced in a cGMP facility of Laila Nutraceuticals, Vijayawada, India. This study utilized a commercial lot of SN13108F (batch no F20010006, manufactured in Jan 2020).", "score": 6}], "note": "AKBA 농축 추출물과 비휘발성 오일 분획 조성", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 1260.686813960144, "y": 781.9966616765397, "anchor": [1377.7146769690935, 705.1075362242732], "radius": 2.6, "color": "#574874", "base_color": "#8870B5"}, {"id": "paper:0c79cf25ae67f664", "kind": "paper", "name": "Papain으로 유도된 골관절염 생쥐 모델에서 四逆湯의 항골관절염 효능에 관한 연구", "title": "Papain으로 유도된 골관절염 생쥐 모델에서 四逆湯의 항골관절염 효능에 관한 연구", "doi": "", "folder": "FILE_9f59be4ad8bd", "fields": ["기타 식물", "생강류"], "field": "기타 식물 · 생강류", "plant_labels": ["Zingiber·생강", "감초(생약명)", "부자(생약명)"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P17", "section": "1) 약재", "text": "본 실험에 사용한 四逆湯(Sayeok-tang, 이하 SYT)의 구성 약 물은 대전대학교 부속한방병원에서 구입하여 정선한 후 사용하 였다. 처방중량은 『古方類聚』 14) 에 나와 있는 처방용량을 기준 으로 사용하였다. 시료 추출은 흡수율을 높이기 위해 약재를 분 말한 후 분말 50 g에 80% 에탄올 500 ml을 가한 후 환류추출장 치를 이용하여 60℃에서 1시간 동안 추출한 후 3M 여과지로 여 과하고 감압증류기를 이용하여 에탄올을 제거한 후 동결건조기 를 이용하여 건조한 다음 분말하여 사용하였다(Table 1).", "score": 7}], "note": "80% 에탄올 환류추출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1182.7969725744947, "y": 967.8052931750417, "anchor": [1112.6030321676035, 949.3487924448709], "radius": 2.6, "color": "#1f645f", "base_color": "#319C95"}, {"id": "paper:74ff81d506405423", "kind": "paper", "name": "Characterization of Lemon Pepper and Black Ginger Extracts and Macroemulsions as Natural Pain Relievers for Spice Stick Balsam Formulation.", "title": "Characterization of Lemon Pepper and Black Ginger Extracts and Macroemulsions as Natural Pain Relievers for Spice Stick Balsam Formulation.", "doi": "10.3390/ph16030371", "folder": "PMC10051517", "fields": ["생강류"], "field": "생강류", "plant_labels": ["Zingiber·생강"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P2", "section": "2. Results / 2.1. Yield and Active Compounds Profiling of Lemon Pepper and Black Ginger Extracts", "text": "The BG was dried using the freeze-drying method and obtained a yield of 33.45% ± 0.01 w / w . Extractions of LP and BG were carried out by the mechanical maceration method using food grade ethanol 70%. The yields obtained were 24% ± 0.00 w / w for LP and 59% ± 0.02 w / w for BG. The bioactive compounds profiling results in LP and BG were shown in Figure 1 . Bioactive compounds with potential anti-inflammatory agents in both spices were identified and categorized ( Table 1 ). Based on the results, five compounds that have the potential as anti-inflammatory agents in LP and BG were found.", "score": 11}], "note": "식품용 70% 에탄올 침출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1029.21393375431, "y": 982.859262406564, "anchor": [1112.6030321676035, 949.3487924448709], "radius": 2.6, "color": "#1f645f", "base_color": "#319C95"}, {"id": "paper:5b505c285f4e7623", "kind": "paper", "name": "Steamed ginger extract ameliorates the symptoms of osteoarthritis", "title": "Steamed ginger extract ameliorates the symptoms of osteoarthritis", "doi": "10.4162/nrp.2025.19.5.682", "folder": "PMC12518753", "fields": ["생강류"], "field": "생강류", "plant_labels": ["Zingiber·생강"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P5", "section": "MATERIALS AND METHODS / Preparation of GGE03", "text": "GGE03 was provided by Genencell Co., Ltd. (Yongin, Korea). The preparation of GGE03 followed a previously described method [ 18 , 19 ]. Briefly, ginger was washed 3 times with water, steamed at 97°C for 2 h, and dried at 50°C for 30 h. The steamed ginger was extracted with a 15-fold volume of 70% ethanol (v/v) at 85°C for 15 h. After extraction, the extract was filtered and concentrated by vacuum evaporation. The concentrate was dried using a spray dryer to achieve a less than 5% moisture content, yielding the final powder as GGE03. High-performance liquid chromatography was used to analyze the 1-dehydro-6-gingerdione content in GGE03, which contained 1.15 mg/g of 1-dehydro-6-gingerdione.", "score": 11}], "note": "증숙 생강을 70% 에탄올 85도 추출. 증숙을 물추출로 오인하지 않음", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 1153.3355461218332, "y": 864.5266470457002, "anchor": [1112.6030321676035, 949.3487924448709], "radius": 2.6, "color": "#1f645f", "base_color": "#319C95"}, {"id": "paper:35a0dc10e7b6dd06", "kind": "paper", "name": "Effects of Daikenchuto on drug-metabolizing enzymes", "title": "Effects of Daikenchuto on drug-metabolizing enzymes", "doi": "10.1002/prp2.361", "folder": "PMC5625165", "fields": ["생강류", "인삼류"], "field": "생강류 · 인삼류", "plant_labels": ["Zingiber·생강", "Panax·인삼"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "abstract", "section": "Abstract", "text": "Herbal medicines and natural products used for maintenance of health or treatment of diseases have many biological effects, including altering the pharmacokinetics and metabolism of other medications. Daikenchuto (TU‐100), an aqueous extract of ginger, ginseng, and Japanese green pepper fruit, is a commonly prescribed Kampo (Japanese herbal medicine) for postoperative ileus or bloating. The effects of TU‐100 on drug metabolism have not been investigated. In this study, we analyzed the effect of TU‐100 on expression of key drug‐metabolizing enzymes (DMEs) and drug transporters (DTs) in murine liver and gastrointestinal tract using a dietary model. Liver, jejunum, and proximal colon were analyzed for phase I and II DMEs and DT mRNA expression by reverse transcription (RT) first by nonquantitative and followed by quantitative polymerase chain reaction (PCR) and pro fan.2019.32.6.678", "folder": "DOI_10.9799_ksfan.2019.32.6.678", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["골담초(일반명)"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "title", "section": "", "text": "골담초 열수추출물의 이화학적 특성 및 MIA를 이용한 동물모델에서 골관절염 개선 효과", "matches": {"물·열수 추출물": "열수추출"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 571.5554535543741, "y": 349.4301199660076, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:b389efe93898e3f4", "kind": "paper", "name": "MIA로 유도된 골관절염 동물모델을 이용한 발효우슬, 당귀, 두충을 포함한 추출복합물의 항골관절염 및 항관절통 효과", "title": "MIA로 유도된 골관절염 동물모델을 이용한 발효우슬, 당귀, 두충을 포함한 추출복합물의 항골관절염 및 항관절통 효과", "doi": "", "folder": "FILE_9a54f41d3e27", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Achyranthes·우슬", "Eucommia·두충", "Angelica·당귀"], "category": "배양·발효 유래 소재", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P14", "section": "FAAE 제조", "text": "본 실험에서 사용된 우슬, 당귀, 두충 원물은 SD P&F (Seoul, Korea)로부터 구입하였다. 우슬의 뿌리는 사용하기 전에 물로 세척하였다. 추출은 95°C에서 4시간 동안 추출기 (COSMOS-660, KYUNGSEO E&P, Incheon, Korea)를 사용하여 원료의 10배의 물로 수행하였다. 추출물을 수집한 후 추출물을 95°C에서 2시간 동안 다시 추출하였다. 추출물 을 로타리 진공 증발기 R-100(DOOYOUNG HI-TECH, Seoul, Korea)을 사용하여 농축하고 발효조(Marubishi, Tokyo, Japan)에서 멸균시켰다. 추출액에 Lactobacillus plantarum 300 mL를 접종하고 37°C에서 24시간 배양하였 다. 발효 생성물을 여과하고 적어도 14 brix로 농축시켰다. 당귀와 두충은 각각 95°C에서 열수로 추출한 후 여과, 농축 하였다. 발효우슬, 당귀, 두충, β-cyclodextrin을 고형분 비 율 기준 3:2.2:1.5:3.3으로 혼합하여 분무 건조하여 실험에 사용하였다. 본 고형분 혼합비율은 효율적인 제조조건 선정 을 위하여 다양한 비율의 복합물을 이용한 비교실험을 통하 여 확정하였다(Jeong 등, 2019).", "score": 7}], "note": "우슬 열수추출 후 발효, 당귀·두충 열수추출물 배합", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 517.2292084381887, "y": 470.97395421561447, "anchor": [516.90257359  of three fractions of P. forrestii alcoholic extracts (PAE), P. forrestii water extracts (PWE), and total flavonoids from P. forrestii (PTF) on Freund’s complete adjuvant (FCA)-induced arthritis in rats, and to use a non-targeted lipidomic method to investigate the mechanism of action of the three fractions of P. forrestii in the treatment of rheumatoid arthritis.", "matches": {"물·열수 추출물": "water extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 602.5748337417871, "y": 406.64543090517867, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:0b4b68255905236e", "kind": "paper", "name": "The efficacy of Nigella sativa oil on serum biomarkers of inflammation and oxidative stress in knee osteoarthritis", "title": "The efficacy of Nigella sativa oil on serum biomarkers of inflammation and oxidative stress in knee osteoarthritis", "doi": "10.1002/fsn3.3708", "folder": "PMC10724594", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Nigella"], "category": "종자유·고정유", "types": ["종자유·고정유"], "evidence": [{"location": "body:P11", "section": "MATERIALS AND METHODS / Randomization and intervention", "text": "Nigella sativa oil was prepared by cold press machine (Barij Essence Pharmaceutical Company, Iran, batch number 402296), and mineral oil was purchased from a pharmacy. 0.1 mL of a mixture containing chlorophyll and red pepper extract in oil‐soluble amounts was added in equal proportion to 150 mL of N. sativa oil as an active oil and mineral oil as a placebo to give it a similar appearance and smell. The active and placebo oils were then packaged in a dark‐colored 60 mL glass by a member of the research team who was outside of any clinical intervention. There was no difference in appearance between the oils given to the patients. For each participant, two glasses were considered (one for topical use and one for oral consumption), and these two containers were numbered from 1 to 45 based on the sequence produced by the mentioned person. Individuals received glasses numbered from 1 to 45 in the order of entering the study and were randomly assigned to study groups. Therefore, allocation concealment and blinding were done in this study.", "score": 11}], "note": "Nigella sativa oil cold press 제조 명시. 광유는 위약", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 447.6829600295035, "y": 446.022033611594, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:f44a2ad6939ea634", "kind": "paper", "name": "Unveiling the therapeutic potential: Evaluation of anti-inflammatory and antineoplastic activity of Magnolia champaca Linn's stem bark isolate.", "title": "Unveiling the therapeutic potential: Evaluation of anti-inflammatory and antineoplastic activity of Magnolia champaca Linn's stem bark isolate.", "doi": "10.1016/j.heliyon.2023.e22972", "folder": "PMC10758728", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Magnolia"], "category": "복수 추출물 유형", "types": ["메탄올·함수메탄올 추출물", "분획·농축·표준화 성분군"], "evidence": [{"location": "abstract", "section": "", "text": "Due to the long-used history of this plant, the present study was designed to explore the in vitro, in vivo and in silico anti-inflammatory and antineoplastic properties of the methanolic extract and fractions and the pure compound isolated from the most active chloroform fraction (CHF) of the stem bark of the plant.", "matches": {"메탄올·함수메탄올 추출물": "methanolic extract", "분획·농축 성분군": "chloroform fraction"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 532.0551406101918, "y": 326.0185503876852, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:fe35795bff2e2e0a", "kind": "paper", "name": "Oleaceae plants: a source of metabolites with atheroprotective potential.", "title": "Oleaceae plants: a source of metabolites with atheroprotective potential.", "doi": "10.3389/fphar.2025.1721433", "folder": "PMC12932613", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Olea", "올리브(일반명)"], "category": "종자유·고정유", "types": ["종자유·고정유"], "evidence": [{"location": "body:P11", "section": "Methods / Plant materials, metabolites, commercial products", "text": "The plant material from which the metabolites were isolated was also extra virgin olive oil.", "matches": {"종자유·고정유": "virgin olive oil"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 565.7451587432315, "y": 465.24397829557233, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:dbdfb726f160e192", "kind": "paper", "name": "Chinese medicine (Tiao-Chang Ke-Min granules) placebo and nocebo effects for diarrhea-predominant irritable bowel syndrome: a study protocol for a randomized controlled trial based on a balanced experimental design.", "title": "Chinese medicine (Tiao-Chang Ke-Min granules) placebo and nocebo effects for diarrhea-predominant irritable bowel syndrome: a study protocol for a randomized controlled trial based on a balanced experimental design.", "doi": "10.1186/s12906-025-05205-1", "folder": "PMC13088461", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Angelica·당귀", "Rosa·장미류", "Codonopsis", "Ilex", "Paeonia", "Saposhnikovia", "Atractylodes", "Prunus", "Crataegus", "Pogostemon", "Descurainia", "작약(생약명)"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P30", "section": "Methods and design / Intervention", "text": "Participants will be randomly assigned to either a TT, a TP, a PP or a PT group. All four study groups will be administered either the TCKM granules or the matched placebo granules. The TCKM formula is composed of twelve herbs. (Table 1 ) These herbs are decocted all at once, and are processed in the form of granules. The placebo is composed of maltodextrin, starch, natural food coloring and sucrose octaacetate. The TCKM granules and placebo are identical in appearance, weight and packaging, and are nearly identical in taste and smell. Participants will take 3 bags of either the TCKM granules or the matched placebo granules twice a day, 30 min after meal times, for 4 weeks. Both of the TCKM granules and the placebo granules will be produced by the Jiangyin Tianjiang Pharmaceutical Co., Ltd. (Jiangsu, China). The production process will adhere strictly to the standards of Good Manufacturing Practice. To ensure the safety and quality of the TCKM granules, the heavy metal content, pesticide residue, microbial limit and stability of the granules will be tested.", "score": 11}], "note": "12종 생약을 함께 decoction 후 과립화. 전탕형으로 배정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 428.0773599940818, "y": 380.5661162735275, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:cf6f85b78eedfeff", "kind": "paper", "name": "27-Week avocado-soybean unsaponifiables treatment in a knee osteoarthritis rabbit model: histomorphometric assessment of potential disease-modifying effects.", "title": "27-Week avocado-soybean unsaponifiables treatment in a knee osteoarthritis rabbit model: histomorphometric assessment of potential disease-modifying effects.", "doi": "10.3389/fvets.2026.1821515", "folder": "PMC13261705", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["아보카도", "대두"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "title", "section": "", "text": "27-Week avocado-soybean unsaponifiables treatment in a knee osteoarthritis rabbit model: histomorphometric assessment of potential disease-modifying effects.", "matches": {"분획·농축 성분군": "unsaponifiables"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 599.5322078748037, "y": 363.7139063772626, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:f1bf29c687e3fb1b", "kind": "paper", "name": "The effect of sumac and cinnamon on lipid profile and quality of life in patients with acute myocardial infarction, type 2 diabetes, and overweight/obesity: study protocol for a randomized double-blind controlled trial.", "title": "The effect of sumac and cinnamon on lipid profile and quality of life in patients with acute myocardial infarction, type 2 diabetes, and overweight/obesity: study protocol for a randomized double-blind controlled trial.", "doi": "10.1186/s40842-026-00326-z", "folder": "PMC13449572", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Cinnamomum", "Rhus"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P20", "section": "Interventions / Intervention description {11a}", "text": "The sumac and cinnamon used in this study are from species Rhus Coriaria and Cinnamomum verum, respectively. The sumac utilized in this study was sourced from the region of Sabzevar, Iran, while the cinnamon was procured from India. Upon acquisition, the samples were subjected to examination in the Quality Control Laboratory to assess microbial contamination. The analysis specifically targeted E. coli, Salmonella, Pseudomonas, Streptococcus, and yeast, and the samples were approved based on the microbial analysis results. After accurately weighing the plant material using a Sartorius digital balance (Practum 224–1 S model, precision ± 0.001 g), extraction was carried out using the aqueous–alcoholic maceration method (70% ethanol) with a Soxhlet-type apparatus (Aseman Lab Co., Iran) for 48 h at 40 °C, maintaining a plant-to-solvent ratio of 1:10 (w/v). To prevent degradation of phenolic compounds, the obtained extract was concentrated in a rotary evaporator (Rotavapor R-3, Büchi, Switzerland) under the following conditions: water bath temperature 35 °C, vacuum pressure 400 mbar, rotation speed 120 rpm. The process continued until the volume was reduced to one-fourth of the original. The concentrated extract was transferred into sterile 50 mL Falcon tubes and freeze-dried using a lyophilizer (Alpha 2–4 LDplus, CHRIST, Germany) under the following conditions: initial freezing temperature − 80 °C, vacuum pressure 0.01 mbar, processing time 48 h. The resulting powder was weighed with a precision of ± 0.0001 g. The standardized extract powder was mixed with permitted oral excipients and binders, such as starch and gelatin, and compressed into 1 g tablets using a tablet press. Quality control tests, including weight uniformity, disintegration time, and dissolution, were performed according to USP standards. Participants will receive tablets formulated so the active extract in each tablet is equivalent to the raw spice. For the single-extract groups, each tablet will contain an amount of sumac or cinnamon extract that provides the equivalent of 3.0 g of raw sumac or 1.0 g of raw cinnamon. This choice was based on previous studies [ 23 , 27 , 29 , 33 – 37 ]. For the mixed group, each tablet will contain amounts of sumac and cinnamon extract that together provide the equivalent of 2.0 g of raw sumac plus 1.0 g of raw cinnamon. All tablets will have a final weight of 1.0 g after addition of inert excipients to ensure uniform tablet mass and manufacturability. Participants will take one tablet daily. The packaging of the supplements will be identical and opaque, prepared by a team external to the study. To mask the distinctive taste and odor, tablets will be produced using film coating by a certified supplement manufacturer external to the research team.", "score": 7}], "note": "70% 에탄올 침출법 명시", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 484.768188930544, "y": 476.26150868006516, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:4fe717bed93f2f83", "kind": "paper", "name": "Protective effects of total fraction of avocado/soybean unsaponifiables on the structural changes in experimental dog osteoarthritis: inhibition of nitric oxide synthase and matrix metalloproteinase-13.", "title": "Protective effects of total fraction of avocado/soybean unsaponifiables on the structural changes in experimental dog osteoarthritis: inhibition of nitric oxide synthase and matrix metalloproteinase-13.", "doi": "10.1186/ar2649", "folder": "PMC2688188", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["아보카도", "대두"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "title", "section": "", "text": "Protective effects of total fraction of avocado/soybean unsaponifiables on the structural changes in experimental dog osteoarthritis: inhibition of nitric oxide synthase and matrix metalloproteinase-13.", "matches": {"분획·농축 성분군": "unsaponifiables"}}], "note": "제목에 명시된 연구 소재 유형 기준", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 479.89437691216006, "y": 325.18080507426805, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:7dcc29b556e149e5", "kind": "paper", "name": "Assessment of blinding to treatment allocation in studies of a cannabis-based medicine (Sativex®) in people with multiple sclerosis: a new approach.", "title": "Assessment of blinding to treatment allocation in studies of a cannabis-based medicine (Sativex®) in people with multiple sclerosis: a new approach.", "doi": "10.1186/1745-6215-13-189", "folder": "PMC3487910", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Cannabis"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "body:P8", "section": "Background", "text": "Sativex® (GW Pharma, Ltd, Salisbury, Wiltshire, UK), is a recently authorised medicine used for the treatment of spasticity in people with multiple sclerosis, and is derived from an extract of the cannabis plant. Its principal components are the two major cannabinoids, delta-9-tetrahydrocannabinol (THC) and cannabidiol (CBD). In order to avoid the extensive first pass metabolism associated with the oral use of cannabinoids, it is taken as a 100 microlitre spray administered to the sub-lingual and buccal mucosal surfaces. Each spray contains 2.7 mg THC and 2.5 mg CBD. THC is the psychoactive component of Sativex®, and is responsible for the psychoactivity which recreational users of cannabis seek; CBD, on the other hand, is not psychoactive, and has been shown to modulate some aspects of the pharmacodynamics of THC. Both components have a distinct pharmacology, and together have been shown to relieve spasticity in people with multiple sclerosis [ 9 - 11 ].", "score": 2}], "note": "THC/CBD 정량화 대마추출 제제; 제조용매 미확정", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 605.3138444557183, "y": 435.35010021787923, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:e8c71147a73b044e", "kind": "paper", "name": "Immunostimulatory effects of the standardized extract of Tinospora crispa on innate immune responses in Wistar Kyoto rats.", "title": "Immunostimulatory effects of the standardized extract of Tinospora crispa on innate immune responses in Wistar Kyoto rats.", "doi": "10.2147/dddt.s85405", "folder": "PMC4468953", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Tinospora"], "category": "에탄올·함수에탄올 추출물", "types": ["에탄올·함수에탄올 추출물"], "evidence": [{"location": "abstract", "section": "", "text": "Therefore, the present study was aimed to investigate the immunomodulatory effects of a standardized 80% ethanol extract of the stem of TC on innate immune responses.", "matches": {"에탄올·함수에탄올 추출물": "ethanol extract"}}], "note": "초록 근거 우선, 없으면 추출·재료·방법 문장. 자동분류 후보이며 실험별 관계 추가 검수 필요", "review_status": "기존 분류 유지: 이번 개별 재검토 대상 아님", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 422.77414937956894, "y": 425.9862661636435, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:31399e8bf48d7603", "kind": "paper", "name": "Efficacy of Elaeagnus Angustifolia extract in the treatment of knee osteoarthritis: a randomized controlled trial.", "title": "Efficacy of Elaeagnus Angustifolia extract in the treatment of knee osteoarthritis: a randomized controlled trial.", "doi": "10.17179/excli2015-639", "folder": "PMC4908661", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Elaeagnus"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P23", "section": "Methods / Extraction procedure", "text": "The whole fruits and their individual components were milled. Two hundred and fifty grams of milled fruit were added to 1000 mL of boiling water and the mixture was boiled for 20 minutes before being filtered through a two-layer mesh. The water extract was con odon grandiflorum was supplied by Hebei Renxin Pharmaceutical Co. Ltd. Platycodon grandiflorum was crushed into fine powder, heated, and refluxed with 95% ethanol solution three times, 1 h for each time. Then, the product was filtered, and the filtrate was recovered and merged with the filtrate obtained from three extractions. The filtrate was dried and mixed with distilled water for resolution, and n -butanol (1 : 1 volume) saturated with water was extracted five times. The n -butanol layer was combined, the n -butanol solution was removed, and the PGE was obtained. The extraction rate of PGE from Platycodon grandiflorum was 8.9%.", "score": 11}], "note": "95%에탄올 조추출 후 n-butanol 분획이 최종 PGE", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 628.9646586302982, "y": 365.8585534783693, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:ecd86c9971a01b8e", "kind": "paper", "name": "Comparison of Elaeagnus angustifolia L. extract and quercetin on mouse model of knee osteoarthritis.", "title": "Comparison of Elaeagnus angustifolia L. extract and quercetin on mouse model of knee osteoarthritis.", "doi": "10.1016/j.jaim.2021.10.001", "folder": "PMC8728052", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Elaeagnus"], "category": "물·열수 추출물", "types": ["물·열수 추출물"], "evidence": [{"location": "body:P5", "section": "Materials and methods / Plant material", "text": "In order to prepare E. angustifolia extract [Herbarium of National Plant Gene Bank of Iran (HNPGBI) 6868], the whole fruits (including peel, flesh and seed) were dried and powdered (150 g). Next, they were added to 1000 ml of boiling water and boiled for 20 min while shaking. The extract was filtered, evaporated and stored at −20 °C. The obtained dried extract was 20 g.", "score": 11}], "note": "끓는 물 20분 추출", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "유형 배정은 모든 제조조건의 확인을 뜻하지 않음", "x": 461.32921665406764, "y": 491.28850578077095, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:70ecda444bb453d9", "kind": "paper", "name": "An oleuropein-based dietary supplement may improve joint functional capacity in older people with high knee joint pain: findings from a multicentre-RCT and post hoc analysis.", "title": "An oleuropein-based dietary supplement may improve joint functional capacity in older people with high knee joint pain: findings from a multicentre-RCT and post hoc analysis.", "doi": "10.1177/1759720x211070205", "folder": "PMC8777337", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["올리브(일반명)"], "category": "분획·농축·표준화 성분군", "types": ["분획·농축·표준화 성분군"], "evidence": [{"location": "abstract", "section": "Abstract", "text": "To investigate a 6-month intervention with an olive leaf extract (OLE) on knee functionality and biomarkers of bone/cartilage metabolism and inflammation. This randomized, double-blind, placebo-controlled, multi-centric trial included 124 subjects with knee pain or mobility issues. Subjects received twice a day one capsule of placebo or 125 mg OLE (Bonolive™, an OLE containing 50 mg of oleuropein) for 6 months. The co-primary endpoints were Knee injury and Osteoarthritis Outcome Score (KOOS) and serum Coll2-1NO2. The secondary endpoints were the subscales of the KOOS, knee pain VAS at rest and at walking, OARSI core set of performance-based tests and multiple inflammatory and bone or cartilage remodeling serum biomarkers and concentration of oleuropein’s metabolites in urine. At 6 months, OLE group was not efficient on global KOOS score, changes of inflammatory and cartilage remodeling biomarkers compared to placebo. Post hoc analyses demonstrated a large and significant treatment effect of OLE in a sub-group of subjects with high walking pain at baseline (p = 0.03). This was observed at 6 months for the global KOOS score, and each different subscale and for pain at walking (p = 0.02). OLE treatment was well tolerated. OLE was not effective on joint discomfort excepted in a sub-group of subjects with high pain at treatment initiation. As oleuropein is well tolerated, OLE can be used to relieve knee joint pain and enhance mobility in subjects with articular pain. Keywords: function, joint pain, nutritional supplement, oleuropein", "score": 4}], "note": "125mg 추출물에 oleuropein 50mg 표준화", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "D", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 485.48509506169887, "y": 300.83064475841803, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:119edeb210a51d89", "kind": "paper", "name": "Tamarindus indica Seed Extract-Based Botanical Compositions Alleviate Knee Pain and Improve Joint Function in Mild-to-Moderate Osteoarthritis", "title": "Tamarindus indica Seed Extract-Based Botanical Compositions Alleviate Knee Pain and Improve Joint Function in Mild-to-Moderate Osteoarthritis", "doi": "10.1155/2022/2226139", "folder": "PMC8791717", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Tamarindus"], "category": "복수 추출물 유형", "types": ["물·열수 추출물", "에탄올·함수에탄올 추출물"], "evidence": [{"location": "body:P7", "section": "2. Materials and Methods / 2.1. Study Materials", "text": "The leftover residue was extracted with water.", "matches": {"물·열수 추출물": "extracted with water"}}, {"location": "body:P8", "section": "2. Materials and Methods / 2.1. Study Materials", "text": "The pulverized fruit rind was extracted with aqueous ethanol, followed by concentration under vacuum and precipitation to obtain G. mangostana fruit rind extract powder.", "matches": {"에탄올·함수에탄올 추출물": "extracted with aqueous ethanol"}}], 0856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:1788d318214ee1a8", "kind": "paper", "name": "Immunomodulatory effects of Tinospora crispa extract and its major compounds on the immune functions of RAW 264.7 macrophages.", "title": "Immunomodulatory effects of Tinospora crispa extract and its major compounds on the immune functions of RAW 264.7 macrophages.", "doi": "10.1016/j.intimp.2018.04.046", "folder": "PMID_29730557", "fields": ["기타 식물"], "field": "기타 식물", "plant_labels": ["Tinospora"], "category": "복수 추출물 유형", "types": ["에탄올·함수에탄올 추출물", "분획·농축·표준화 성분군"], "evidence": [{"location": "body:P18", "section": "2.3. Extraction of plant material and isolation of compounds", "text": "The dried stems of T. crispa (0.4 kg) were ground and soaked in 80% ethanol (1.5 L) at 25 °C for 72 h. The combined ethanol extracts were concentrated in vacuo at 55-60 °C to yield 38.3 g of dry extract. The extract was fractionated into alkaloid and non-alkaloid fractions by acid-base extraction method. Briefly, TCE (38.3 g) was acidified with 5% H2SO4 to pH 2 and the mixture was left to soak for 2 h and was later partitioned with CHCl3. The CHCl3 layer was concentrated in vacuo to obtain a brown gummy residue of non-alkaloidal fraction (26.1 g). The aqueous layer was then basified with 10% Na2CO3, adjusted to pH9 and extracted with CHCl3. The CHCl3 phase-containing alkaloids were collected and concentrated to a dark brown gummy residue (4.3 g). The crude alkaloid residue was subjected to column chromatography over silica gel type 60 (40-63 μM) with a gradient system of n-hexane-CHCl3 (10:0 to 0:10, v/v) and CHCl3-MeOH (10:0 to 0:10, v/v) to obtain 20mL of each fraction. Thin-layer chromatography (TLC) was used to check the fractions and fractions with similar TLC pattern were combined to yield 19 subfractions (F1-F19). The subfractions F7, F11, F13 and F19 were further subjected to silica gel column chromatography eluting with a gradient system of CHCl3-MeOH (10:0 to 0:10, v/v) to yield compounds 1 (32.6mg), 2 (90mg), 3 (5mg) and 4 (13mg), respectively. The non-alkaloid fraction (26.1 g) was sequentially extracted with n-hexane, CH2Cl2, EtOAc and MeOH. The CH2Cl2 fraction was fractionated using vacuum liquid chromatography (VLC) over silica gel type 60HF254 (10-40 μM), by using a gradient system of n-hexaneMeOH (10:0 to 0:10, v/v) to yield 13 subfractions (FH1-FH13). Fraction FH7 was subjected to column chromatography and eluted with a gradient system of n-hexane-CHCl3 (10:0 to 0:10, v/v) to yield compound 6 (82.9mg). Fraction FH11 was chromatographed on silica gel type 60 column with a gradient system of CHCl3-MeOH (10:0 to 0:10, v/v) to yield compound 5 (8mg). The 1 H and 13 C nuclear magnetic resonance (NMR) spectra were obtained using a NMR 500MHz (JOEL Ltd., Japan), with tetramethylsilane (TMS) as internal standard. Molecular weights of the compounds were determined by using electrospray ionization time-of-flight mass spectrometer (ESI-TOF-MS) (Bruker MicroToF-Q 86, Switzerland). The purity of the isolated compounds was > 98% as determined by NMR and MS-TOF data and based on their physicochemical properties. TCE and the isolated compounds were evaluated for possible endotoxin contamination by Limulus Amebocyte Lysate (LAL) assay (Cambrex BioScience, Walkersville, MD) following the manufacturer's recommended instructions. The samples were not found to contain significant amounts of endotoxin which could potentially interfere with the study at the concentrations used.", "score": 11}], "note": "80%에탄올 조추출물과 alkaloid/non-alkaloid 분획 및 성분 비교", "review_status": "수집 본문·표·초록·제목 근거 개별 재검토", "plant_evidence": "제목: 이번 재검토 범위 밖", "manufacturing_caution": "분획·농축·표준화 성분군 배정. 제조용매의 확인 여부는 논문별 근거·비고 참조; 표준화 함량만으로 용매를 추정하지 않음.", "x": 644.3688399546212, "y": 440.2265857203125, "anchor": [516.9025735906653, 400.543671330856], "radius": 2.6, "color": "#485661", "base_color": "#718797"}, {"id": "paper:665f11b8e7983ae7", "kind": "pa  activate GST P to inhibit ASK1-JNK/p38 pathway via approaches of qRT-PCR and Western blot. Results: Results of molecular docking indicated that all three compounds spontaneously docked to GST P, among them the binding affinities of both HSYA and syringin to GST P were higher than NAG. In vivo, GHI reduced myocardial infarction size and mitigated myocardial pathological injury. In vitro, GHI enhanced cell viability and extenuated depolarization of mitochondrial membrane potential. In addition, the results of in vivo and in vitro studies demonstrated that the cardioprotection of GHI was associated with improving the mRNA and protein expression levels of GST P to modulate oxidative stress, and inhibiting the levels of mRNA expression and protein phosphorylation of ASK1, JNK, and p38. However, the suppressed effect of GHI on ASK1-JNK/p38 pathway was reversed by ethacrynic acid (EA, a GST inhibitor), indicating that the regulation of GHI on ASK1-JNK/p38 was related to the activity of GST P. Besides, the in vitro results of qRT-PCR and western-blot also certified that the inhibited JNK and p38 further reduced Bax expression and elevated Bcl-2 expression to reduce the expression of caspase-3 to exert anti-apoptosis effects. Conclusion: Taken together, the cardioprotection of GHI mainly incarnated in activating GST P to relieve oxidation properties, thereby inhibiting ASK1-JNK/p38 pathway to suppress apoptosis. cardiovascular diseases (e.g., acute myocardial infarction (AMI) and heart failure (HF)), refers to the restoration of blood flow to ischemic coronary artery, which is usually accompanied by high morbidity and Abbreviations: AAR, Area at risk; ASK1, Apoptosis signal-regulating kinase-1; CCK-8, Cell counting kit-8; DMEM, Dulbecco's modified Eagle's medium; EA, Ethacrynic acid; FBS, Fetal bovine serum; GHI, Guhong injection; GSH-Px, Glutathione peroxidase; GST P, Glutathione S-transferase Pi; HSYA, Hydroxysafflor yellow A; H/R, Hypoxia/reoxygenation; JNK, c-Jun N-term   if(n.doi){const a=addText(pane,'a','DOI 원문 열기 ↗');a.href='https://doi.org/'+encodeURI(n.doi);a.target='_blank';a.rel='noopener noreferrer'}
  addText(pane,'h3','원자료의 식물 라벨');addText(pane,'p',n.plant_labels.join(' / '));addText(pane,'p','식물 분류 근거: '+n.plant_evidence,'muted');
  if(n.fields.length>1)addText(pane,'p','이 논문은 여러 식물 묶음에 배정되어 있습니다. 대표 추출물 유형을 각 묶음에 연결한 것이며, 모든 식물을 같은 방법으로 추출했다는 뜻은 아닙니다.','instruction');
  addText(pane,'h3','연결된 식물·추출물');linked(id).forEach(e=>listButton(pane,index.get(e.source),e.field));
  addText(pane,'h3','재검토 판단');addText(pane,'p',n.note||'별도 비고 없음');addText(pane,'p',n.review_status,'muted');addText(pane,'p',n.manufacturing_caution,'muted');
  addText(pane,'h3','저장된 분류 근거');
  for(const ev of n.evidence)evidenceCard(pane,n.category,[ev.location,ev.section].filter(Boolean).join(' · '),ev.text);
  if(!n.evidence.length)addText(pane,'p','상세 근거 문장이 저장되어 있지 않습니다.','muted');
 }else{
  const es=linked(id),f=fields.find(f=>f.name===n.field);listButton(pane,f,'상위 식물 묶음');
  addText(pane,'p',es.length+'편 · '+n.field+'의 표시 '+f.visible_count+'편 중 '+(es.length/f.visible_count*100).toFixed(2)+'%');
  if(n.category==='복수 추출물 유형')addText(pane,'p','여러 추출물을 비교·혼합한 논문을 한 범주로 유지했습니다. 세부 유형은 각 논문을 클릭하면 확인할 수 있습니다.','instruction');
  if(n.category==='분획·농축 성분군')addText(pane,'p','분획·농축·표준화 소재를 포함합니다. 제조용매까지 확인되었다는 뜻은 아닙니다.','instruction');
  addText(pane,'h3','연결 논문 ('+es.length+'편)');es.map(e=>index.get(e.target)).sort((a,b)=>title(a).localeCompare(title(b))).forEach(p=>listButton(pane,p,p.field));
 }
 paint();pane.scrollTop=0;
}

function reset(){current=null;$('search').value='';$('results').hidden=true;intro();paint()}
const edgeGroup=el('g'),nodeGroup=el('g'),labelGroup=el('g');svg.append(edgeGroup,nodeGroup,labelGroup);
data.edges.forEach(e=>{const paper=index.get(e.target),stroke=e.type==='SG_HAS_PAPER'?paper.color:'#929BA8';const line=el('line',{class:'edge',stroke});if(e.type==='DISPLAY_HAS_FIELD')line.setAttribute('stroke-dasharray','5 5');edgeGroup.append(line);edgeEls.push(line)});
for(const n of [...data.nodes].sort((a,b)=>a.radius-b.radius)){
 const g=el('g',{class:'node','data-id':n.id,tabindex:0,role:'button','aria-label':nodeLabel(n)});
 const dot=el('circle',{class:'dot',r:n.radius,fill:n.color,stroke:n.kind==='paper'?n.color:'white'});g.append(dot);const hit=el('circle',{class:'hit',r:Math.max(n.radius,6)});g.append(hit);
 g.addEventListener('pointerenter',e=>tooltip(n,e));g.addEventListener('pointermove',e=>tooltip(n,e));g.addEventListener('pointerleave',()=>{$('tooltip').style.display='none'});
 g.addEventListener('click',e=>{e.stopPropagation();select(n.id)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id)}});nodeGroup.append(g);nodeEls.set(n.id,g);
 if(n.kind==='paper')continue;const label=el('g',{class:'label'});
 if(n.kind==='field'){label.classList.add('field-label');const w=n.name.length>10?224:190;label.append(el('rect',{x:-w/2,y:43,width:w,height:31,rx:15,fill:'white',stroke:n.color,'stroke-width':1}));const t=el('text',{y:64,'text-anchor':'middle','font-size':14,'font-weight':700,fill:'#30343D'});t.textContent=n.name;label.append(t)}
 else{const t=el('text',{y:n.kind==='root'?7:-n.radius-9,'text-anchor':'middle','font-size':n.kind==='root'?23:13,'font-weight':n.kind==='root'?700:500,fill:n.kind==='root'?'white':'#4e5664'});if(n.kind!=='root'){t.setAttribute('paint-order','stroke');t.setAttribute('stroke','white');t.setAttribute('stroke-width','4')}t.textContent=n.name;label.append(t)}
 labelGroup.append(label);labelEls.set(n.id,label);
}
$('spacing').oninput=()=>{layout();paint()};$('labels').onchange=paint;$('topics').onchange=paint;$('fit').onclick=fit;$('reset').onclick=reset;
$('export-png').onclick=exportPng;
$('search').oninput=()=>{current=null;paint();const term=$('search').value.trim().toLowerCase(),r=$('results');r.replaceChildren();r.hidden=!term;if(!term)return;const matches=data.nodes.filter(n=>[title(n),n.field,...(n.plant_labels||[])].filter(Boolean).join(' ').toLowerCase().includes(term));addText(r,'div',matches.length?'검색 결과 '+matches.length+'개'+(matches.length>40?' · 상위 40개 표시':''):'검색 결과가 없습니다.','result-count');matches.slice(0,40).forEach(n=>listButton(r,n,kinds[n.kind]));};
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))$('results').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});
svg.addEventListener('wheel',e=>{e.preventDefault();const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),factor=Math.exp(Math.max(-.25,Math.min(.25,e.deltaY*.001)));if(box[2]*factor<90||box[2]*factor>4500)return;box=[p.x+(box[0]-p.x)*factor,p.y+(box[1]-p.y)*factor,box[2]*factor,box[3]*factor];setBox();$('tooltip').style.display='none'},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,box:[...box],matrix:svg.getScreenCTM().inverse(),moved:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const a=new DOMPoint(drag.x,drag.y).matrixTransform(drag.matrix),b=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);drag.moved ||= Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>3;box=[drag.box[0]+a.x-b.x,drag.box[1]+a.y-b.y,drag.box[2],drag.box[3]];setBox()});svg.addEventListener('pointerup',()=>{if(drag&&!drag.moved)reset();drag=null});svg.addEventListener('pointercancel',()=>drag=null);
layout();fit();intro();paint();
</script></body></html>
